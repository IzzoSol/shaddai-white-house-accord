/* Seeded RNG (mulberry32) — deterministic runs, testable. */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* provisional ending after Act II; signing can flip it one step */
function computeEndingId(state) {
  const L = state.ledger, f = state.flags;
  if (f.zuckCaption && L.drama >= 2) return 'glassesLeak';
  if (f.elonPosted && L.sam) return 'promptOff';
  if (L.typoAlive && L.meme >= 3) return 'viralTypo';
  if (f.darioTesting && L.substance >= 3 && L.optics <= 1) return 'safetyCaucus';
  if (f.sandDone && L.optics >= 2) return 'sandSermon';
  if (state.playerId === 'brockman' && !L.sam) return 'absentCEO';
  if (L.optics >= 3 && L.substance >= 2 && L.drama <= 1 && !L.typoAlive) return 'perfect';
  if (L.optics >= 3 && L.substance <= 1) return 'constitution';
  if (L.meme >= 2) return 'viralTypo';
  if (L.substance >= 2) return 'safetyCaucus';
  return 'constitution';
}

/* rounded-rect path */
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, (n >> 16) + amt));
  const g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt));
  const b = Math.max(0, Math.min(255, (n & 255) + amt));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* ---- character renderer v2: faces, necks, builds ----
   Coordinates are in "s" units. The figure's origin is the hips; shoulders are at -34s, the head centre at -57s,
   feet at +32s. A character is CHAR_ART[id] plus optional face / build / eye / nose / brow / lips fields; anything
   not given is derived from the character's id, so extras get their own look too. */

const FACES = {
  oval:   { hw: 11.8, jaw: 9.4,  chin: 0.35 },
  square: { hw: 12.6, jaw: 11.6, chin: 0.08 },
  long:   { hw: 11.0, jaw: 8.4,  chin: 0.45 },
  round:  { hw: 12.9, jaw: 11.2, chin: 0.0 },
  heart:  { hw: 12.0, jaw: 7.4,  chin: 0.8 },
  wide:   { hw: 13.3, jaw: 10.6, chin: 0.2 }
};
const BUILDS = {
  slim:   { w: 18.5, belly: 0,   legs: 1.04, h: 1.02 },
  avg:    { w: 20.5, belly: 0.6, legs: 1.0,  h: 1.0 },
  broad:  { w: 23.5, belly: 1.6, legs: 1.0,  h: 1.03 },
  stocky: { w: 22.5, belly: 3.2, legs: 0.93, h: 0.97 }
};
const FACE_KEYS = Object.keys(FACES), BUILD_KEYS = Object.keys(BUILDS);
function idHash(id) { let h = 2166136261; for (let i = 0; i < id.length; i++) { h ^= id.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

function charSpec(id) {
  const a = CHAR_ART[id] || CHAR_ART.player;
  if (a._spec) return a._spec;
  const h = idHash(id);
  const spec = Object.assign({
    face: FACE_KEYS[h % FACE_KEYS.length], build: BUILD_KEYS[(h >> 3) % BUILD_KEYS.length],
    eye: ['#3a2a1c', '#2a3a4a', '#3f3a22', '#241c18'][(h >> 5) % 4],
    nose: 0.8 + ((h >> 7) % 5) * 0.12, brow: 0.9 + ((h >> 9) % 4) * 0.18, lips: 0.85 + ((h >> 11) % 4) * 0.15, eyeSize: 0.95 + ((h >> 13) % 4) * 0.07
  }, a);
  a._spec = spec;
  return spec;
}

/* mouth + brows by expression: brow tilt (positive = worried/raised inner end), mouth curve, teeth */
const EXPR = {
  smile: { tilt: 0.0, curve: 1.6, teeth: false },  grin: { tilt: -0.2, curve: 2.6, teeth: true },
  stiff: { tilt: 0.1, curve: 0.0, teeth: false },  wince: { tilt: 0.9, curve: -1.4, teeth: false },
  preacher: { tilt: -0.3, curve: 0.9, teeth: false }, flat: { tilt: 0.0, curve: 0.0, teeth: false },
  deadpan: { tilt: 0.1, curve: -0.2, teeth: false }
};

/* ---- head: origin at the centre of the face ---- */
function drawHead(c, a0, s, blink, look, mouth, expOver, brow) {
  const a = a0.face ? a0 : charSpec(a0.id || 'player');
  const F = FACES[a.face] || FACES.oval;
  const hw = F.hw * s, jw = F.jaw * s, chinW = (5.2 * (1 - F.chin) + 1.2 * F.chin) * s;
  const top = -14.8 * s, bottom = 13.4 * s;
  mouth = mouth || 0; brow = brow || 0;
  const ex = EXPR[expOver || a.exp] || EXPR.flat;
  c.save();
  if (look) c.translate(look * 0.9 * s, 0);

  /* hair behind the head (long hair, volume) */
  c.fillStyle = a.hairC;
  if (a.hair === 'long') {
    c.beginPath(); c.moveTo(-hw - 2.2 * s, -4 * s); c.bezierCurveTo(-hw - 5 * s, 10 * s, -hw - 2 * s, 18 * s, -hw + 1 * s, 22 * s);
    c.lineTo(hw - 1 * s, 22 * s); c.bezierCurveTo(hw + 2 * s, 18 * s, hw + 5 * s, 10 * s, hw + 2.2 * s, -4 * s); c.closePath(); c.fill();
  }
  /* ears */
  const earY = 1.2 * s;
  c.fillStyle = shade(a.skin, -14);
  c.beginPath(); c.ellipse(-hw - 0.4 * s, earY, 2.3 * s, 3.4 * s, 0, 0, 7); c.fill();
  c.beginPath(); c.ellipse(hw + 0.4 * s, earY, 2.3 * s, 3.4 * s, 0, 0, 7); c.fill();
  c.fillStyle = shade(a.skin, -38);
  c.beginPath(); c.ellipse(-hw - 0.2 * s, earY, 1.0 * s, 1.9 * s, 0, 0, 7); c.fill();
  c.beginPath(); c.ellipse(hw + 0.2 * s, earY, 1.0 * s, 1.9 * s, 0, 0, 7); c.fill();

  /* skull + jaw */
  c.fillStyle = a.skin;
  c.beginPath();
  c.moveTo(-hw, -2 * s);
  c.bezierCurveTo(-hw, top, hw, top, hw, -2 * s);
  c.bezierCurveTo(hw, 5 * s, jw, 10.5 * s, chinW, bottom);
  c.lineTo(-chinW, bottom);
  c.bezierCurveTo(-jw, 10.5 * s, -hw, 5 * s, -hw, -2 * s);
  c.closePath(); c.fill();
  /* soft form: shadow down the far side, forehead light, cheek colour */
  c.save(); c.clip();
  c.fillStyle = 'rgba(0,0,0,0.085)'; c.fillRect(hw * 0.35, -16 * s, hw, 32 * s);
  c.fillStyle = 'rgba(255,255,255,0.07)'; c.beginPath(); c.ellipse(-hw * 0.2, -9 * s, hw * 0.7, 3.2 * s, 0, 0, 7); c.fill();
  c.fillStyle = 'rgba(235,110,95,0.13)';
  c.beginPath(); c.ellipse(-hw * 0.52, 5.6 * s, 3.4 * s, 2.2 * s, 0, 0, 7); c.fill();
  c.beginPath(); c.ellipse(hw * 0.52, 5.6 * s, 3.4 * s, 2.2 * s, 0, 0, 7); c.fill();
  c.restore();

  /* eyes */
  const ey = -2.4 * s, exx = 4.7 * s * (0.96 + F.hw / 60), ew = 3.2 * s * a.eyeSize, eh = 2.1 * s * a.eyeSize;
  for (const sx of [-1, 1]) {
    const cx = sx * exx;
    if (blink) {
      c.strokeStyle = shade(a.skin, -90); c.lineWidth = 1.2 * s; c.lineCap = 'round';
      c.beginPath(); c.moveTo(cx - ew * 0.9, ey + 0.3 * s); c.quadraticCurveTo(cx, ey + 1.1 * s, cx + ew * 0.9, ey + 0.3 * s); c.stroke();
    } else {
      c.fillStyle = '#fbfaf6'; c.beginPath(); c.ellipse(cx, ey, ew, eh, 0, 0, 7); c.fill();
      const px = cx + (look || 0) * 0.9 * s;
      c.fillStyle = a.eye; c.beginPath(); c.arc(px, ey + 0.1 * s, eh * 0.82, 0, 7); c.fill();
      c.fillStyle = '#0c0a09'; c.beginPath(); c.arc(px, ey + 0.1 * s, eh * 0.42, 0, 7); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.9)'; c.beginPath(); c.arc(px - eh * 0.28, ey - eh * 0.3, eh * 0.2, 0, 7); c.fill();
      /* upper lid line + a hint of lower lid */
      c.strokeStyle = shade(a.skin, -105); c.lineWidth = 1.1 * s; c.lineCap = 'round';
      c.beginPath(); c.moveTo(cx - ew, ey + 0.1 * s); c.quadraticCurveTo(cx, ey - eh * 1.25, cx + ew, ey + 0.1 * s); c.stroke();
      c.strokeStyle = 'rgba(0,0,0,0.12)'; c.lineWidth = 0.7 * s;
      c.beginPath(); c.moveTo(cx - ew * 0.8, ey + eh * 0.9); c.quadraticCurveTo(cx, ey + eh * 1.35, cx + ew * 0.8, ey + eh * 0.9); c.stroke();
    }
  }
  /* brows: tapered, tilted by expression and by speaking */
  const by = ey - 4.3 * s - brow * 1.5 * s, bt = (ex.tilt + brow * 0.2) * 1.5 * s, bw = 1.15 * s * a.brow;
  c.fillStyle = shade(a.hairC, a.hair === 'bald' ? 25 : -6);
  for (const sx of [-1, 1]) {
    const x0 = sx * (exx + ew * 1.15), x1 = sx * (exx - ew * 1.0);            /* outer, inner */
    c.beginPath();
    c.moveTo(x0, by + bt * 0.2 * -1 + 0.4 * s); c.quadraticCurveTo((x0 + x1) / 2, by - 1.1 * s, x1, by - bt);
    c.lineTo(x1, by - bt + bw); c.quadraticCurveTo((x0 + x1) / 2, by - 0.1 * s + bw * 0.5, x0, by + 0.4 * s + bw * 0.6);
    c.closePath(); c.fill();
  }
  /* nose */
  const nz = a.nose;
  c.strokeStyle = shade(a.skin, -50); c.lineWidth = 1.05 * s; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-0.5 * s, ey + 1.4 * s); c.quadraticCurveTo(-1.4 * nz * s, 3.2 * s, -1.9 * nz * s, 4.3 * s);
  c.quadraticCurveTo(0, 5.6 * s, 1.9 * nz * s, 4.3 * s); c.stroke();
  c.fillStyle = 'rgba(0,0,0,0.12)'; c.beginPath(); c.ellipse(0.6 * s, 4.6 * s, 2.0 * nz * s, 0.8 * s, 0, 0, 7); c.fill();
  /* mouth */
  const my = 8.4 * s, mw = 3.3 * s * a.lips, curve = ex.curve * s;
  if (mouth > 0.08) {
    c.fillStyle = '#4a1b17'; c.beginPath();
    c.ellipse(0, my + 0.3 * s, mw * 0.78, (0.7 + 2.5 * mouth) * s, 0, 0, 7); c.fill();
    c.fillStyle = '#f4efe6'; c.fillRect(-mw * 0.6, my - 0.4 * s, mw * 1.2, 0.9 * s);
  } else if (ex.teeth) {
    c.fillStyle = '#4a1b17'; c.beginPath(); c.moveTo(-mw, my - 0.4 * s); c.quadraticCurveTo(0, my + curve + 1.4 * s, mw, my - 0.4 * s); c.quadraticCurveTo(0, my + 0.2 * s, -mw, my - 0.4 * s); c.fill();
    c.fillStyle = '#f7f3ea'; c.beginPath(); c.moveTo(-mw * 0.85, my - 0.2 * s); c.quadraticCurveTo(0, my + curve * 0.9, mw * 0.85, my - 0.2 * s); c.quadraticCurveTo(0, my + 0.5 * s, -mw * 0.85, my - 0.2 * s); c.fill();
  } else {
    c.strokeStyle = '#7d3a31'; c.lineWidth = 1.3 * s; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-mw, my); c.quadraticCurveTo(0, my + curve, mw, my); c.stroke();
    c.fillStyle = 'rgba(160,70,60,0.35)'; c.beginPath(); c.ellipse(0, my + 1.1 * s + Math.max(0, curve) * 0.15, mw * 0.6, 0.7 * s, 0, 0, 7); c.fill();
  }

  /* facial hair */
  if (a.beard) {
    c.fillStyle = shade(a.hairC, 6);
    c.beginPath(); c.moveTo(-hw + 0.8 * s, 3 * s); c.bezierCurveTo(-hw + 1 * s, 12 * s, -chinW, bottom + 1.2 * s, 0, bottom + 1.2 * s);
    c.bezierCurveTo(chinW, bottom + 1.2 * s, hw - 1 * s, 12 * s, hw - 0.8 * s, 3 * s);
    c.bezierCurveTo(hw - 3 * s, 7.5 * s, 4 * s, 6.4 * s, 0, 6.4 * s); c.bezierCurveTo(-4 * s, 6.4 * s, -hw + 3 * s, 7.5 * s, -hw + 0.8 * s, 3 * s); c.fill();
    c.fillStyle = shade(a.hairC, 6); c.beginPath(); c.ellipse(0, 7 * s, 4.2 * s, 1 * s, 0, 0, 7); c.fill();
    /* the mouth shows through the beard */
    c.strokeStyle = '#6a2e27'; c.lineWidth = 1.1 * s; c.beginPath(); c.moveTo(-mw * 0.8, my + 0.3 * s); c.quadraticCurveTo(0, my + curve * 0.8 + 0.3 * s, mw * 0.8, my + 0.3 * s); c.stroke();
  }

  /* hair on top: always leaves the forehead and eyes clear */
  c.fillStyle = a.hairC;
  const hl = shade(a.hairC, 26);
  if (a.hair === 'swoop') {
    c.beginPath(); c.moveTo(-hw - 1.6 * s, -1.5 * s); c.bezierCurveTo(-hw - 3.5 * s, -15 * s, -4 * s, -21 * s, 4 * s, -19.5 * s);
    c.bezierCurveTo(12 * s, -18.5 * s, hw + 3.4 * s, -12 * s, hw + 1.4 * s, -3 * s);
    c.bezierCurveTo(hw - 2.5 * s, -9.5 * s, 5 * s, -12.5 * s, -3 * s, -11.5 * s); c.bezierCurveTo(-8 * s, -10.5 * s, -11 * s, -6 * s, -hw - 1.6 * s, -1.5 * s); c.fill();
    c.strokeStyle = hl; c.lineWidth = 0.9 * s; c.beginPath(); c.moveTo(-6 * s, -16 * s); c.quadraticCurveTo(2 * s, -19 * s, 9 * s, -16 * s); c.stroke();
  } else if (a.hair === 'buzz') {
    c.beginPath(); c.moveTo(-hw + 0.4 * s, -4.5 * s); c.bezierCurveTo(-hw - 0.6 * s, -18.4 * s, hw + 0.6 * s, -18.4 * s, hw - 0.4 * s, -4.5 * s);
    c.quadraticCurveTo(hw - 3 * s, -9.5 * s, 0, -10.2 * s); c.quadraticCurveTo(-hw + 3 * s, -9.5 * s, -hw + 0.4 * s, -4.5 * s); c.fill();
  } else if (a.hair === 'curls') {
    for (let i = 0; i < 9; i++) { const t = i / 8, ang = Math.PI * (1.06 + t * 0.88), cx2 = Math.cos(ang) * (hw + 0.6 * s), cy2 = -3 * s + Math.sin(ang) * 13.2 * s; c.beginPath(); c.arc(cx2, cy2, 3.3 * s, 0, 7); c.fill(); }
    c.beginPath(); c.moveTo(-hw - 1 * s, -3 * s); c.bezierCurveTo(-hw - 1 * s, -15 * s, hw + 1 * s, -15 * s, hw + 1 * s, -3 * s); c.quadraticCurveTo(hw - 4 * s, -9 * s, 0, -9.6 * s); c.quadraticCurveTo(-hw + 4 * s, -9 * s, -hw - 1 * s, -3 * s); c.fill();
    c.fillStyle = hl; for (let i = 0; i < 4; i++) { c.beginPath(); c.arc(-6 * s + i * 4 * s, -14.4 * s + (i % 2) * 0.8 * s, 1.1 * s, 0, 7); c.fill(); }
  } else if (a.hair === 'neat') {
    c.beginPath(); c.moveTo(-hw - 0.4 * s, -3.4 * s); c.bezierCurveTo(-hw - 1.6 * s, -20 * s, hw + 1.6 * s, -20 * s, hw + 0.4 * s, -3.4 * s);
    c.quadraticCurveTo(hw - 4 * s, -10.2 * s, 2 * s, -11 * s); c.quadraticCurveTo(-hw + 3 * s, -10.4 * s, -hw - 0.4 * s, -3.4 * s); c.fill();
    c.strokeStyle = hl; c.lineWidth = 0.9 * s; c.beginPath(); c.moveTo(-6 * s, -14.4 * s); c.quadraticCurveTo(0, -15.8 * s, 6 * s, -14.2 * s); c.stroke();

    const side = a.hair === 'side';

    c.quadraticCurveTo(hw - 3 * s, -9.2 * s, side ? -3 * s : 1 * s, -10.6 * s); c.quadraticCurveTo(-hw + 2 * s, -9 * s, -hw - 0.6 * s, -2.6 * s); c.fill();
    if (side) { c.strokeStyle = shade(a.hairC, -20); c.lineWidth = 0.9 * s; c.beginPath(); c.moveTo(-3 * s, -10.6 * s); c.quadraticCurveTo(-3.6 * s, -13 * s, -2 * s, -15 * s); c.stroke(); }
    c.strokeStyle = hl; c.lineWidth = 0.9 * s; c.beginPath(); c.moveTo(-5 * s, -14 * s); c.quadraticCurveTo(1 * s, -15.4 * s, 6 * s, -13.6 * s); c.stroke();
  } else if (a.hair === 'long') {
    c.beginPath(); c.moveTo(-hw - 1.4 * s, 4 * s); c.bezierCurveTo(-hw - 3 * s, -15 * s, hw + 3 * s, -15 * s, hw + 1.4 * s, 4 * s);
    c.quadraticCurveTo(hw - 2 * s, -7 * s, 0, -8.4 * s); c.quadraticCurveTo(-hw + 2 * s, -7 * s, -hw - 1.4 * s, 4 * s); c.fill();
  } else if (a.hair === 'bald') {
    c.fillStyle = 'rgba(255,255,255,0.1)'; c.beginPath(); c.ellipse(-2 * s, -11.6 * s, 6 * s, 2.4 * s, -0.2, 0, 7); c.fill();
    c.fillStyle = a.hairC; c.globalAlpha = 0.55;                                                  /* a thin fringe at the sides */
    c.beginPath(); c.moveTo(-hw - 0.2 * s, -4.5 * s); c.quadraticCurveTo(-hw - 1 * s, 0, -hw + 0.2 * s, 2.4 * s); c.lineTo(-hw + 1.4 * s, 0.6 * s); c.quadraticCurveTo(-hw + 1 * s, -3 * s, -hw + 1.8 * s, -4.5 * s); c.fill();
    c.beginPath(); c.moveTo(hw + 0.2 * s, -4.5 * s); c.quadraticCurveTo(hw + 1 * s, 0, hw - 0.2 * s, 2.4 * s); c.lineTo(hw - 1.4 * s, 0.6 * s); c.quadraticCurveTo(hw - 1 * s, -3 * s, hw - 1.8 * s, -4.5 * s); c.fill();
    c.globalAlpha = 1;
  }

  /* glasses */
  if (a.glasses) {
    c.strokeStyle = '#1d2128'; c.lineWidth = 1.05 * s; c.lineJoin = 'round';

      const gx = sx * exx - 3.9 * s, gy = ey - 2.9 * s;
      rr(c, gx, gy, 7.8 * s, 5.8 * s, 1.6 * s); c.stroke();

  }
  c.restore();
}

/* ---- body: origin at the hips ---- */
function drawTorso(c, a0, s, armPhase, pose, gest) {
  const a = a0.build ? a0 : charSpec(a0.id || 'player');
  const B = BUILDS[a.build] || BUILDS.avg;
  gest = gest || 0;
  const w = B.w * s, belly = B.belly * s, legL = 30 * s * B.legs;
  const skinD = shade(a.skin, -18);
  c.save();
  c.lineCap = 'round'; c.lineJoin = 'round';

  /* legs, shoes */
  if (pose === 'stand' || pose === 'walk' || pose === 'point') {
    const swing = pose === 'walk' ? Math.sin(armPhase) * 8 * s : 0;
    const lw = (7.6 + B.belly * 0.35) * s, gap = 1.2 * s;
    for (const sx of [-1, 1]) {
      const off = sx * swing * 0.45;
      const x0 = sx < 0 ? -gap - lw + off : gap + off;
      c.fillStyle = shade(a.suit, -14);
      c.beginPath(); c.moveTo(x0 + 0.5 * s, 0); c.lineTo(x0 + lw - 0.5 * s, 0); c.lineTo(x0 + lw - 0.4 * s - sx * 0.4 * s, legL); c.lineTo(x0 + 0.4 * s + sx * 0.4 * s, legL); c.closePath(); c.fill();
      c.strokeStyle = 'rgba(255,255,255,0.07)'; c.lineWidth = 0.8 * s; c.beginPath(); c.moveTo(x0 + lw / 2, 3 * s); c.lineTo(x0 + lw / 2, legL - 1 * s); c.stroke();
      c.fillStyle = '#17110d'; c.beginPath(); c.ellipse(x0 + lw / 2 + sx * 0.8 * s + (sx > 0 ? 1.4 * s : -1.4 * s) * 0, legL + 1.4 * s, lw * 0.62, 2.5 * s, 0, 0, 7); c.fill();
    }
  }

  /* jacket body: sloped shoulders, a waist that follows the build */
  const waist = w - 2.2 * s + belly * 0.5;
  c.fillStyle = a.suit;
  c.beginPath();
  c.moveTo(-w * 0.34, -38 * s); c.quadraticCurveTo(-w * 0.82, -37 * s, -w, -33 * s);
  c.bezierCurveTo(-w - 1.2 * s, -22 * s, -waist - belly, -8 * s, -waist - belly * 0.4, 1.5 * s);
  c.lineTo(waist + belly * 0.4, 1.5 * s);
  c.bezierCurveTo(waist + belly, -8 * s, w + 1.2 * s, -22 * s, w, -33 * s);
  c.quadraticCurveTo(w * 0.82, -37 * s, w * 0.34, -38 * s);
  c.closePath(); c.fill();
  c.fillStyle = 'rgba(0,0,0,0.12)'; c.beginPath(); c.moveTo(w * 0.34, -38 * s); c.quadraticCurveTo(w * 0.82, -37 * s, w, -33 * s);
  c.bezierCurveTo(w + 1.2 * s, -22 * s, waist + belly, -8 * s, waist + belly * 0.4, 1.5 * s); c.lineTo(waist * 0.35, 1.5 * s);
  c.bezierCurveTo(w * 0.5, -10 * s, w * 0.5, -26 * s, w * 0.34, -38 * s); c.fill();

  /* neck and shirt */
  c.fillStyle = skinD; rr(c, -3.1 * s, -45 * s, 6.2 * s, 9 * s, 2 * s); c.fill();
  c.fillStyle = a.skin; rr(c, -3.1 * s, -45 * s, 4.6 * s, 8 * s, 2 * s); c.fill();
  c.fillStyle = a.shirt;
  c.beginPath(); c.moveTo(-8.2 * s, -37.5 * s); c.lineTo(0, -22 * s); c.lineTo(8.2 * s, -37.5 * s); c.quadraticCurveTo(0, -34.5 * s, -8.2 * s, -37.5 * s); c.fill();
  /* collar */
  c.fillStyle = shade(a.shirt, 8);
  c.beginPath(); c.moveTo(-8.2 * s, -37.5 * s); c.lineTo(-3.4 * s, -36 * s); c.lineTo(-4.6 * s, -31.5 * s); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(8.2 * s, -37.5 * s); c.lineTo(3.4 * s, -36 * s); c.lineTo(4.6 * s, -31.5 * s); c.closePath(); c.fill();
  /* lapels + buttons */
  c.strokeStyle = shade(a.suit, 24); c.lineWidth = 1.5 * s;
  c.beginPath(); c.moveTo(-8.2 * s, -37.5 * s); c.lineTo(-2.4 * s, -20 * s); c.lineTo(-6.4 * s, -10.5 * s);
  c.moveTo(8.2 * s, -37.5 * s); c.lineTo(2.4 * s, -20 * s); c.lineTo(6.4 * s, -10.5 * s); c.stroke();
  c.fillStyle = shade(a.suit, 38); c.beginPath(); c.arc(0.9 * s, -7 * s, 0.9 * s, 0, 7); c.fill(); c.beginPath(); c.arc(0.9 * s, -2 * s, 0.9 * s, 0, 7); c.fill();
  /* tie */
  if (a.tie) {
    c.fillStyle = a.tie;
    c.beginPath(); c.moveTo(-2 * s, -33.5 * s); c.lineTo(2 * s, -33.5 * s); c.lineTo(a.trumpTie ? 3.4 * s : 1.7 * s, a.trumpTie ? 2 * s : -11.5 * s); c.lineTo(0, a.trumpTie ? 5 * s : -8 * s); c.lineTo(a.trumpTie ? -3.4 * s : -1.7 * s, a.trumpTie ? 2 * s : -11.5 * s); c.closePath(); c.fill();
    c.fillStyle = shade(a.tie, -26); c.beginPath(); c.moveTo(-2.5 * s, -35 * s); c.lineTo(2.5 * s, -35 * s); c.lineTo(2 * s, -31.4 * s); c.lineTo(-2 * s, -31.4 * s); c.closePath(); c.fill();
  }

  /* arms: shoulder → elbow → hand, with a sleeve and a cuff */
  const sh = -34 * s;
  const arm = (x0, y0, x1, y1, x2, y2) => {
    c.strokeStyle = shade(a.suit, -6); c.lineWidth = 6.4 * s;
    c.beginPath(); c.moveTo(x0, y0); c.quadraticCurveTo(x1, y1, x2, y2); c.stroke();
    c.strokeStyle = a.shirt; c.lineWidth = 6.8 * s; c.beginPath(); c.moveTo(x2 - (x2 - x1) * 0.12, y2 - (y2 - y1) * 0.12); c.lineTo(x2, y2); c.stroke();
    c.fillStyle = a.skin; c.beginPath(); c.arc(x2 + (x2 - x1) * 0.12, y2 + (y2 - y1) * 0.12 + 0.6 * s, 3.1 * s, 0, 7); c.fill();
    c.fillStyle = 'rgba(0,0,0,0.1)'; c.beginPath(); c.arc(x2 + (x2 - x1) * 0.12 + 0.7 * s, y2 + (y2 - y1) * 0.12 + 1.2 * s, 2.4 * s, 0, 7); c.fill();
  };
  if (pose === 'sit') {
    arm(-w + 2.4 * s, sh, -w - 5 * s, sh + 15 * s, -10 * s, 3 * s);
    arm(w - 2.4 * s, sh, w + 5 * s + gest * 4 * s, sh + 15 * s - gest * 12 * s, 10 * s + gest * 4 * s, 3 * s - gest * 14 * s);
  } else if (pose === 'point') {
    arm(-w + 2.4 * s, sh, -w - 3.5 * s, sh + 13 * s, -w - 2.2 * s, -4 * s);

  } else {
    const sw = pose === 'walk' ? Math.sin(armPhase) * 9 * s : 0;
    arm(-w + 2.4 * s, sh, -w - 1.4 * s - sw * 0.3, sh + 15 * s, -w + 1.2 * s + sw * 0.5, -3 * s);
    arm(w - 2.4 * s, sh, w + 1.4 * s + sw * 0.3 + gest * 9 * s, sh + 14 * s - gest * 14 * s, w - 1.2 * s - sw * 0.5 + gest * 12 * s, -3 * s - gest * 26 * s);
  }

  /* props */
  if (a.phone) { c.fillStyle = '#0c0e12'; rr(c, w - 4 * s, -17 * s, 6 * s, 10.5 * s, 1.6 * s); c.fill(); c.fillStyle = 'rgba(140,180,255,0.85)'; rr(c, w - 3.2 * s, -16 * s, 4.4 * s, 7.4 * s, 1 * s); c.fill(); }
  if (a.vial) { c.fillStyle = 'rgba(240,220,150,0.92)'; rr(c, -w + 1 * s, -11 * s, 4 * s, 9.5 * s, 2 * s); c.fill(); c.fillStyle = '#b09a54'; c.fillRect(-w + 1 * s, -13 * s, 4 * s, 2.4 * s); }
  if (a.laptop) { c.fillStyle = '#3a4048'; rr(c, w - 12 * s, -9 * s, 14 * s, 9.5 * s, 1.5 * s); c.fill(); c.fillStyle = 'rgba(150,190,255,0.8)'; rr(c, w - 11 * s, -8 * s, 12 * s, 6.6 * s, 1 * s); c.fill(); }
  if (a.leather) {
    c.strokeStyle = '#0c0c0e'; c.lineWidth = 3.2 * s; c.beginPath(); c.moveTo(-w * 0.34, -38 * s); c.lineTo(-4.6 * s, -21 * s); c.moveTo(w * 0.34, -38 * s); c.lineTo(4.6 * s, -21 * s); c.stroke();
    
  }
  if (a.beads) { c.strokeStyle = '#c9a227'; c.lineWidth = 1.3 * s; c.beginPath(); c.arc(0, -35 * s, 8 * s, 0.45, 2.69); c.stroke(); }
  c.restore();
}

/* ---- full figure ----
   opt: pose ('stand'|'walk'|'sit'|'point'), phase (walk cycle), look (-1..1), blink, flip,
        t (time, for breathing), talk (true while speaking), exp (expression override). */
function drawFigure(c, id, x, y, s, opt) {
  opt = opt || {};
  const a = charSpec(id);
  const B = BUILDS[a.build] || BUILDS.avg;
  s = s * B.h;
  const pose = opt.pose || 'stand';
  const phase = opt.phase || 0;
  const look = opt.look || 0;
  const blink = opt.blink || false;
  const t = opt.t || 0;
  const seed = (String(id).charCodeAt(0) || 1) + String(id).length * 3;
  const talking = !!opt.talk;
  const breathe = 1 + 0.013 * Math.sin(t * 1.7 + seed);
  const mouth = talking ? (0.5 + 0.5 * Math.sin(t * 13 + seed)) * (0.55 + 0.45 * Math.sin(t * 4.7 + seed)) : 0;
  const gest = talking ? Math.max(0, Math.sin(t * 2.2 + seed)) * 0.85 : 0;
  const brow = talking ? Math.max(0, Math.sin(t * 3.1 + seed * 2)) * 0.6 : 0;
  const bounce = pose === 'walk' ? -Math.abs(Math.sin(phase)) * 2.4 * s : 0;
  const nod = talking ? Math.sin(t * 5.2 + seed) * 0.6 * s : 0;
  c.save();
  c.translate(x, y + bounce);
  if (opt.flip) c.scale(-1, 1);
  c.fillStyle = 'rgba(0,0,0,0.28)';
  c.beginPath(); c.ellipse(0, 1.5 * s - bounce + 30 * s * B.legs - 28 * s, 15 * s * (B.w / 20.5), 3.4 * s, 0, 0, 7); c.fill();
  c.save(); c.scale(1, breathe);
  drawTorso(c, a, s, phase, pose, gest);
  c.restore();
  c.save(); c.translate(0, -57 * s + nod + (breathe - 1) * -30 * s);
  drawHead(c, a, s, blink, look, mouth, opt.exp, brow);
  c.restore();
  c.restore();
}

/* ---- faceTime window (Sam) ---- */
function drawFaceTime(c, x, y, w, h, t) {
  c.save();
  rr(c, x, y, w, h, 6); c.clip();
  c.fillStyle = '#121826'; c.fillRect(x, y, w, h);
  const s = w / 90;
  drawFigure(c, 'sam', x + w * 0.5, y + h * 0.96, s * 1.15, { pose: 'stand', look: Math.sin(t * 0.9) });
  /* goblin merch bouncing */
  const gy = y + h - 26 * s * 1.15 - Math.abs(Math.sin(t * 3)) * 8;
  c.fillStyle = '#3f7d4e';
  c.beginPath(); c.arc(x + w * 0.18, gy, 9, 0, 7); c.fill();
  c.fillStyle = '#fff'; c.font = 'bold 10px Georgia'; c.textAlign = 'center';
  c.fillText('DOTS', x + w * 0.18, gy + 4);
  c.fillStyle = '#0c0e12'; rr(c, x + w * 0.62, y + 8, 26, 14, 3); c.fill();
  c.fillStyle = '#e8c96a'; c.font = 'bold 9px monospace';
  c.fillText('LIVE', x + w * 0.62 + 13, y + 18);
  c.restore();
  c.strokeStyle = '#3a4f7a'; c.lineWidth = 2;
  rr(c, x, y, w, h, 6); c.stroke();
}

/* ==================== mini.js ==================== */
/* ==================== mini.js — six micro-games (no falling orbs) ==================== */

let mini = null;   // { id, t, elapsed, done, success, residue, toast, title, how, time }

function startMini(id) {
  const def = MINI[id];
  mini = { id: id, t: 0, elapsed: 0, done: false, success: false, residue: null, toast: '', title: def.title, how: def.how, time: def.time };
  def.init();
}
function finishMini(success, residue, toast) {
  mini.success = success; mini.residue = residue || {}; mini.toast = toast || ''; mini.done = true;
}

/* The window every micro-game plays in. Positions inside a micro-game are relative to this. */
function miniPanel() {
  const pw = Math.min(760, W * 0.72), ph = Math.min(430, H * 0.72);
  return { pw: pw, ph: ph, px: (W - pw) / 2, py: (H - ph) / 2 };
}

/* ---- shared chrome ---- */
function drawMiniShell(c, W, H, t) {
  c.fillStyle = 'rgba(7,10,18,0.72)'; c.fillRect(0, 0, W, H);
  const pw = Math.min(760, W * 0.72), ph = Math.min(430, H * 0.72);
  const px = (W - pw) / 2, py = (H - ph) / 2;
  c.fillStyle = PAL.cream; rr(c, px, py, pw, ph, 10); c.fill();
  c.strokeStyle = PAL.gold; c.lineWidth = 2.5; rr(c, px, py, pw, ph, 10); c.stroke();
  c.fillStyle = PAL.ink; c.font = 'bold 24px Georgia, serif'; c.textAlign = 'left';
  c.fillText(mini.title, px + 24, py + 40);
  c.fillStyle = '#4a3a28'; c.font = '16px Georgia, serif';
  wrapText(c, mini.how, px + 24, py + 66, pw - 48, 20, 'left');
  /* time bar */
  const frac = 1 - Math.min(1, mini.elapsed / mini.time);
  c.fillStyle = '#d9cfae'; rr(c, px + 24, py + ph - 26, pw - 48, 10, 5); c.fill();
  c.fillStyle = frac > 0.3 ? PAL.green : PAL.red; rr(c, px + 24, py + ph - 26, (pw - 48) * frac, 10, 5); c.fill();
  return { px: px, py: py, pw: pw, ph: ph };
}

/* ---- shared East Room background ---- */
function drawEastRoomBg(c, t, variant) {
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b1220'); g.addColorStop(0.55, '#16233c'); g.addColorStop(1, '#1d2f4d');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  /* wainscoting */
  c.fillStyle = '#141d30'; c.fillRect(0, 330, W, H - 330);
  c.fillStyle = '#1a2740'; c.fillRect(0, 330, W, 8);
  for (let x = 10; x < W; x += 64) { c.fillStyle = 'rgba(232,201,106,0.06)'; c.fillRect(x, 346, 2, 120); }
  /* chandelier with bloom */
  const chx = W / 2, chy = 74 + Math.sin(t * 0.6) * 3;
  const bloom = c.createRadialGradient(chx, chy, 4, chx, chy, 150);
  bloom.addColorStop(0, 'rgba(244,227,161,0.5)'); bloom.addColorStop(1, 'rgba(244,227,161,0)');
  c.fillStyle = bloom; c.fillRect(chx - 160, chy - 100, 320, 260);
  c.strokeStyle = '#c9a227'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(chx, 0); c.lineTo(chx, chy - 34); c.stroke();
  c.beginPath(); c.ellipse(chx, chy, 52, 15, 0, 0, 7); c.stroke();
  c.beginPath(); c.ellipse(chx, chy - 16, 30, 10, 0, 0, 7); c.stroke();
  for (let i = -2; i <= 2; i++) {
    c.fillStyle = '#f4e3a1';
    c.beginPath(); c.arc(chx + i * 22, chy + 2 + Math.abs(i) * 5, 3.4, 0, 7); c.fill();
  }
  /* gold curtains, drifting */
  for (const side of [0, 1]) {
    const cx = side ? W - 130 : 0;
    const drift = Math.sin(t * 0.4 + side * 2) * 4;
    c.fillStyle = '#7a1f1f';
    c.beginPath();
    c.moveTo(cx + drift, 0);
    c.bezierCurveTo(cx + 90 + drift, H * 0.3, cx + 30 + drift, H * 0.7, cx + 70 + drift, H);
    c.lineTo(cx + (side ? 130 : -20) + drift, H);
    c.bezierCurveTo(cx + (side ? 60 : 60) + drift, H * 0.6, cx + (side ? 110 : 20) + drift, H * 0.25, cx + (side ? 130 : -20), 0);
    c.closePath(); c.fill();
    c.fillStyle = 'rgba(201,162,39,0.22)';
    for (let i = 0; i < 4; i++) c.fillRect(cx + 12 + i * 22 + drift, 0, 5, H);
  }
  /* tall windows with protest dots outside */
  for (const wx of [170, W - 300]) {
    c.fillStyle = '#0e1830';
    rr(c, wx, 96, 130, 220, 4); c.fill();
    c.strokeStyle = '#c9a227'; c.lineWidth = 3; rr(c, wx, 96, 130, 220, 4); c.stroke();
    c.beginPath(); c.moveTo(wx + 65, 96); c.lineTo(wx + 65, 316); c.moveTo(wx, 206); c.lineTo(wx + 130, 206); c.stroke();
    /* night outside */
    c.fillStyle = 'rgba(232,201,106,0.05)';
    c.beginPath(); c.arc(wx + 30, 140, 16, 0, 7); c.fill();
    /* protest dots bobbing */
    c.fillStyle = '#e8c96a';
    for (let i = 0; i < 7; i++) {
      const px2 = wx + 18 + i * 16, py2 = 268 + Math.sin(t * 2 + i * 1.7) * 4;
      c.beginPath(); c.arc(px2, py2, 2.6, 0, 7); c.fill();
    }
  }
}

/* ---- cast ---- */
function drawCast(c, t) {
  c.fillStyle = PAL.dusk; c.fillRect(0, 0, W, H);
  c.fillStyle = PAL.gold2; c.font = '600 32px Georgia, serif'; c.textAlign = 'center';
  c.fillText('WHO ARE YOU AT THE TABLE?', W / 2, 50);
  c.fillStyle = 'rgba(245,239,221,0.62)'; c.font = '15px Georgia, serif';
  c.fillText('Six signatories. Your seat is already a choice.', W / 2, 76);
  const cards = CAST.filter(k => k.starter || k.id === 'trump');
  const rows = [cards.slice(0, 4), cards.slice(4)];
  const cw = 262, chh = 276, gap = 16;
  rows.forEach((row, ri) => {
    const totalW = row.length * cw + (row.length - 1) * gap;
    const x0 = (W - totalW) / 2;
    const y = 92 + ri * (chh + 14);
    row.forEach((k, i) => {
      const x = x0 + i * (cw + gap), cx = x + cw / 2;
      const isLocked = !!k.locked && !UNLOCKED.trump;
      const hot2 = !isLocked && MX > x && MX < x + cw && MY > y && MY < y + chh;
      if (!isLocked) HOTRECTS.push({ x: x, y: y, w: cw, h: chh, id: 'pick_' + k.id });   /* the whole card is the button */
      c.fillStyle = hot2 ? '#1d2f4d' : '#16233c';
      rr(c, x, y, cw, chh, 10); c.fill();
      c.strokeStyle = hot2 ? PAL.gold : '#26365a'; c.lineWidth = hot2 ? 2.5 : 1.5;
      rr(c, x, y, cw, chh, 10); c.stroke();
      /* portrait medallion */
      c.fillStyle = '#0e1830';
      c.beginPath(); c.arc(cx, y + 60, 40, 0, 7); c.fill();
      c.strokeStyle = PAL.gold; c.lineWidth = 2; c.beginPath(); c.arc(cx, y + 60, 40, 0, 7); c.stroke();
      c.save();
      c.beginPath(); c.arc(cx, y + 60, 38, 0, 7); c.clip();
      drawFigure(c, k.id, cx, y + 106, 0.9, { pose: 'stand' });
      c.restore();
      /* signed badge, top corner */
      c.fillStyle = k.signed ? '#7ef0a8' : '#ffb4b4'; c.font = 'bold 10px Georgia, serif'; c.textAlign = 'right';
      c.fillText(k.signed ? 'SIGNED ✓' : 'NOT SIGNED', x + cw - 12, y + 20);
      /* name, company, quote, seat tell: each below the last, so nothing collides */
      c.fillStyle = PAL.gold2; c.font = 'bold 17px Georgia, serif'; c.textAlign = 'center';
      c.fillText(k.name, cx, y + 126);

/* Is this person talking right now? (their line is still being typed) */
function isSpeaking(id) {
  const tk = G.talk;
  if (G.screen !== 'talk' || !tk || tk.id !== id || tk.phase !== 'lines') return false;
  const cur = tk.lines[tk.lineIdx] || '';
  return tk.typeT * 34 < cur.length;
}

/* ---- THE ROOM (playable) ---- */
function drawRoom(c, t, dt) {
  worldDraw(c, t, dt);
  drawHUD(c);
}

/* ---- HUD: exactly four things ---- */
function drawHUD(c) {
  /* 1. who you are + the AURA meter + rapport; 2. side goals (drawn by drawAuraMeter) */
  drawAuraMeter(c, G.t);
  /* 3. objective: the box fits its text */
  const obj = G.talksDone.length >= 3
    ? 'The pen is up. Walk to the President’s desk.'
    : 'Objective: talk to 3 people at the table (' + G.talksDone.length + '/3)';
  c.font = '14px Georgia, serif';
  const ow = Math.min(W - 700, c.measureText(obj).width + 40);
  c.fillStyle = 'rgba(7,10,18,0.7)';
  rr(c, W / 2 - ow / 2, 14, ow, 30, 8); c.fill();
  c.fillStyle = PAL.gold2; c.textAlign = 'center';
  c.fillText(obj, W / 2, 34);
  /* the press clock */
  if (G.human && !G.sealed) {
    const m = Math.floor(G.clock / 60), sec = Math.floor(G.clock % 60), low = G.clock < 30;
    c.fillStyle = low ? 'rgba(120,20,20,0.85)' : 'rgba(7,10,18,0.7)'; rr(c, W - 262, 14, 156, 30, 8); c.fill();
    c.fillStyle = low ? '#ffb0a8' : PAL.gold2; c.font = 'bold 13px Georgia, serif'; c.textAlign = 'center';
    c.fillText('PRESS IN ' + m + ':' + (sec < 10 ? '0' : '') + sec, W - 184, 34);
  }
  /* pause hint */
  c.fillStyle = 'rgba(7,10,18,0.7)';
  rr(c, W - 96, 14, 82, 30, 8); c.fill();
  c.fillStyle = 'rgba(245,239,221,0.8)'; c.font = '12px Georgia, serif'; c.textAlign = 'center';
  c.fillText('P = MENU', W - 55, 34);
  /* toast: one at a time, centred under the objective so it never covers a window or a button */
  if (G.toast && G.t - G.toast.born < 5.2) {
    const a = Math.min(1, (5.2 - (G.t - G.toast.born)) / 1.2) * Math.min(1, (G.t - G.toast.born) / 0.18 + 0.2);
    c.font = '15px Georgia, serif';
    const tw2 = Math.min(640, W - 120);
    const lines2 = wrapTextLines(c, G.toast.t, tw2 - 36);
    const th2 = 22 * lines2.length + 18;
    const tx2 = W / 2 - tw2 / 2, ty2 = 54;
    c.fillStyle = 'rgba(7,10,18,' + (0.86 * a) + ')';
    rr(c, tx2, ty2, tw2, th2, 10); c.fill();
    c.strokeStyle = 'rgba(201,162,39,' + (0.7 * a) + ')'; c.lineWidth = 1.2; rr(c, tx2, ty2, tw2, th2, 10); c.stroke();
    c.fillStyle = 'rgba(245,239,221,' + a + ')'; c.textAlign = 'center';
    lines2.forEach((l, i) => c.fillText(l, W / 2, ty2 + 27 + i * 22));
  }
}

/* ---- dialogue (talk) ---- */
function drawTalk(c, t, dt) {
  drawRoom(c, t, dt);
  c.fillStyle = 'rgba(7,10,18,0.5)'; c.fillRect(0, 0, W, H);
  const tk = G.talk;
  const who = CAST.find(k => k.id === tk.id) || { id: tk.id, name: 'Tom Brown', co: 'Designer · far end of the table' };
  const pw = 1100, ph = 236, px2 = (W - pw) / 2, py2 = H - ph - 28;
  const tx = px2 + 176, tw = pw - 176 - 36;
  /* the window */
  c.fillStyle = 'rgba(0,0,0,0.35)'; rr(c, px2 + 4, py2 + 6, pw, ph, 12); c.fill();
  c.fillStyle = PAL.cream; rr(c, px2, py2, pw, ph, 12); c.fill();
  c.strokeStyle = PAL.gold; c.lineWidth = 2.5; rr(c, px2, py2, pw, ph, 12); c.stroke();
  /* speaker portrait */
  const mx = px2 + 90, my = py2 + 100;
  c.fillStyle = '#0e1830'; c.beginPath(); c.arc(mx, my, 58, 0, 7); c.fill();
  c.strokeStyle = PAL.gold; c.lineWidth = 3; c.beginPath(); c.arc(mx, my, 58, 0, 7); c.stroke();
  c.save(); c.beginPath(); c.arc(mx, my, 55, 0, 7); c.clip();
  drawFigure(c, who.id, mx, my + 56, 1.25, { pose: 'stand', blink: Math.sin(t * 0.9) > 0.985, t: t, talk: isSpeaking(tk.id), exp: tk.react });
  c.restore();
  /* speaker name */
  c.fillStyle = PAL.ink; c.font = 'bold 21px Georgia, serif'; c.textAlign = 'left';
  c.fillText(who.name.toUpperCase(), tx, py2 + 38);
  c.fillStyle = '#6a5a44'; c.font = '14px Georgia, serif'; c.textAlign = 'right';
  c.fillText(who.co, px2 + pw - 30, py2 + 38);
  /* lines so far (dim), current line typed */
  const shown = tk.lines.slice(0, tk.lineIdx + 1);
  const cur = shown[shown.length - 1] || '';
  const typed = cur.slice(0, Math.floor(tk.typeT * 34));
  let yy = py2 + 70;
  c.font = 'italic 16px Georgia, serif'; c.textAlign = 'left';
  shown.slice(0, -1).forEach(l => { c.fillStyle = 'rgba(16,20,28,0.5)'; yy = wrapText(c, l, tx, yy, tw, 21, 'left') + 23; });
  c.fillStyle = PAL.ink; c.font = 'italic 20px Georgia, serif';
  wrapText(c, typed + (Math.sin(t * 6) > 0 ? '|' : ''), tx, yy + 2, tw, 25, 'left');
  /* continue hint, or the two replies */
  const allShown = tk.lineIdx >= tk.lines.length - 1 && tk.typeT * 34 >= cur.length;
  if (!allShown) {
    c.fillStyle = 'rgba(16,20,28,0.55)'; c.font = '13px Georgia, serif'; c.textAlign = 'right';
    c.fillText('click or press Space to continue', px2 + pw - 30, py2 + ph - 18);
  }
  if (tk.phase === 'replies') {
    const bw2 = (tw - 14) / 2, bh2 = 58;
    tk.replies.forEach((rep, i) => {
      const bx2 = tx + i * (bw2 + 14), by2 = py2 + ph - bh2 - 18;
      const hot2 = MX > bx2 && MX < bx2 + bw2 && MY > by2 && MY < by2 + bh2;
      c.fillStyle = hot2 ? '#2a4066' : '#1d2f4d';
      rr(c, bx2, by2, bw2, bh2, 10); c.fill();
      c.strokeStyle = hot2 ? PAL.gold : '#3a4a68'; c.lineWidth = hot2 ? 2.5 : 1.5;
      rr(c, bx2, by2, bw2, bh2, 10); c.stroke();
      c.fillStyle = PAL.gold; c.beginPath(); c.arc(bx2 + 28, by2 + bh2 / 2, 14, 0, 7); c.fill();
      c.fillStyle = '#101b2d'; c.font = 'bold 15px Georgia, serif'; c.textAlign = 'center';
      c.fillText(String(i + 1), bx2 + 28, by2 + bh2 / 2 + 5);
      c.fillStyle = PAL.cream; c.font = '16px Georgia, serif';
      const n = wrapCount(c, rep.t, bw2 - 92);
      wrapText(c, rep.t, bx2 + 52 + (bw2 - 52) / 2, by2 + (n > 1 ? 24 : 35), bw2 - 92, 19, 'center');
      HOTRECTS.push({ x: bx2, y: by2, w: bw2, h: bh2, id: 'reply_' + i });
    });
  }
}

/* ---- the signing: you become Trump ---- */
function drawSign(c, t, dt) {
  /* driveway warm light through windows */
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1a1208'); g.addColorStop(0.5, '#2a1c0c'); g.addColorStop(1, '#0f0a06');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  /* warm lamps */
  for (const lx of [180, W - 180]) {
    const lg = c.createRadialGradient(lx, 120, 8, lx, 120, 220);
    lg.addColorStop(0, 'rgba(240,146,79,0.32)'); lg.addColorStop(1, 'rgba(240,146,79,0)');
    c.fillStyle = lg; c.fillRect(lx - 230, -60, 460, 380);
  }
  /* Trump at the desk (you) */
  drawFigure(c, 'trump', W / 2 - 260, 470, 2.6, { pose: 'point', look: 0.4, blink: Math.sin(t) > 0.98 });
  /* the desk + document */
  c.fillStyle = PAL.wood;
  rr(c, W / 2 - 90, 400, 470, 150, 8); c.fill();
  c.fillStyle = PAL.wood3; rr(c, W / 2 - 90, 400, 470, 18, 6); c.fill();
  c.fillStyle = 'rgba(0,0,0,0.2)'; c.fillRect(W / 2 - 90, 536, 470, 14);
  /* document fills the desk */
  const dx = W / 2 - 60, dy = 372, dw = 410, dh = 176;
  c.fillStyle = '#faf6ea'; rr(c, dx, dy, dw, dh, 3); c.fill();
  c.strokeStyle = '#d8cba0'; c.lineWidth = 2; rr(c, dx, dy, dw, dh, 3); c.stroke();
  c.fillStyle = '#1a1a1a'; c.font = 'bold 13px Georgia, serif'; c.textAlign = 'center';
  c.fillText('WHITE HOUSE ACCORD', dx + dw / 2, dy + 26);
  c.font = '10px Georgia, serif';
  c.fillText('Joint Commitment on Frontier Responsibilities', dx + dw / 2, dy + 42);
  /* signature block */
  c.font = '11px Georgia, serif'; c.textAlign = 'left';
  const names = ['Sundar Pichai — Google / Alphabet', 'Dario Amodei — Anthropic', 'Mark Zuckerberg — Meta',
                 'Greg Brockman — OpenAI', 'Elon Musk — xAI', 'Jensen Huang — Nvidia'];
  names.forEach((n2, i) => c.fillText(n2, dx + 30, dy + 66 + i * 15));
  /* the typo line */
  const ty = dy + 66 + 6 * 15;
  c.fillStyle = '#1a1a1a'; c.font = 'bold 12.5px Georgia, serif';
  const line = 'Donald J. Trump, President of the Unites States';
  c.fillText(line, dx + 30, ty);
  const tw2 = c.measureText(line).width;
  c.strokeStyle = PAL.red; c.lineWidth = 1.6;
  c.beginPath(); c.moveTo(dx + 30, ty + 4); c.lineTo(dx + 30 + tw2, ty + 4); c.stroke();
  /* camera flash */
  const fl = Math.sin(t * 2.2);
  if (fl > 0.9) {
    const fg = c.createRadialGradient(W / 2, 300, 4, W / 2, 300, 200);
    fg.addColorStop(0, 'rgba(255,255,255,0.5)'); fg.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = fg; c.fillRect(0, 100, W, 400);
  }
  /* sign line narration */
  const sl = SIGN_LINES[Math.min(G.signLine, SIGN_LINES.length - 1)];
  if (G.signPhase !== 'mic') {
    c.fillStyle = 'rgba(7,10,18,0.7)'; rr(c, W / 2 - 360, H - 158, 720, 58, 10); c.fill();
    c.fillStyle = 'rgba(245,239,221,0.97)'; c.font = 'italic 19px Georgia, serif';
    wrapText(c, sl, W / 2, H - 133, 680, 24, 'center');
  }
  /* choices: giant, readable */
  if (G.signPhase === 'choices') {
    SIGN_CHOICES.forEach((ch, i) => {
      const bw2 = 250, bx2 = W / 2 - 395 + i * 265, by2 = H - 92;
      const hot2 = MX > bx2 && MX < bx2 + bw2 && MY > by2 && MY < by2 + 54;
      c.fillStyle = hot2 ? PAL.gold : 'rgba(16,20,28,0.85)';
      rr(c, bx2, by2, bw2, 54, 8); c.fill();
      c.strokeStyle = PAL.gold; c.lineWidth = 2; rr(c, bx2, by2, bw2, 54, 8); c.stroke();
      c.fillStyle = hot2 ? '#101b2d' : PAL.gold2; c.font = 'bold 18px Georgia, serif'; c.textAlign = 'center';
      c.fillText(ch.t, bx2 + bw2 / 2, by2 + 34);
      HOTRECTS.push({ x: bx2, y: by2, w: bw2, h: 54, id: 'sign_' + ch.id });
    });
  } else if (G.signPhase === 'mic') {
    /* who got the mic: invisible ledger, visible as a real choice */
    c.fillStyle = 'rgba(7,10,18,0.7)'; rr(c, W / 2 - 300, H - 170, 600, 44, 10); c.fill();
    c.fillStyle = 'rgba(245,239,221,0.97)';
    c.font = 'italic 19px Georgia, serif'; c.textAlign = 'center';
    c.fillText('Trump points at the room: “Who says a word?”', W / 2, H - 141);
    const talked = G.talksDone.slice(0, 3);
    const all = talked.concat(['nobody']);
    const bw2 = Math.min(180, (W - 120) / all.length - 12);
    const totalW = all.length * bw2 + (all.length - 1) * 12;
    all.forEach((id, i) => {
      const bx2 = W / 2 - totalW / 2 + i * (bw2 + 12), by2 = H - 118;
      const label = id === 'nobody' ? 'NO ONE' : CAST.find(k => k.id === id).name.split(' ')[0].toUpperCase();
      const hot2 = MX > bx2 && MX < bx2 + bw2 && MY > by2 && MY < by2 + 44;
      c.fillStyle = hot2 ? PAL.gold : 'rgba(16,20,28,0.85)';
      rr(c, bx2, by2, bw2, 44, 8); c.fill();
      c.strokeStyle = PAL.gold; c.lineWidth = 2; rr(c, bx2, by2, bw2, 44, 8); c.stroke();
      c.fillStyle = hot2 ? '#101b2d' : PAL.gold2; c.font = 'bold 15px Georgia, serif'; c.textAlign = 'center';
      c.fillText(label, bx2 + bw2 / 2, by2 + 28);
      HOTRECTS.push({ x: bx2, y: by2, w: bw2, h: 44, id: 'mic_' + id });
    });
  } else {
    c.fillStyle = 'rgba(245,239,221,0.7)'; c.font = '13px Georgia, serif'; c.textAlign = 'center';
    c.fillText('click or press Space to continue', W / 2, H - 52);
  }
  drawHUD(c);
}

/* ---- the gaggle: driveway, 20 seconds ---- */
function drawGaggle(c, t, dt) {
  /* orange outdoor light */
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#160e06'); g.addColorStop(0.6, '#3a2410'); g.addColorStop(1, '#120a06');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  for (const lx of [140, 420, 860, 1140]) {
    const lg = c.createRadialGradient(lx, 90, 6, lx, 90, 180);
    lg.addColorStop(0, 'rgba(240,146,79,0.4)'); lg.addColorStop(1, 'rgba(240,146,79,0)');
    c.fillStyle = lg; c.fillRect(lx - 190, -60, 380, 320);
  }
  /* white house behind, more orange */
  c.fillStyle = '#f0924f';
  c.globalAlpha = 0.16;
  c.beginPath(); c.moveTo(W / 2 - 320, 470); c.lineTo(W / 2 - 320, 300); c.lineTo(W / 2, 210); c.lineTo(W / 2 + 320, 300); c.lineTo(W / 2 + 320, 470); c.closePath(); c.fill();
  c.globalAlpha = 1;
  for (let i = 0; i < 8; i++) { c.fillStyle = 'rgba(245,239,221,0.12)'; c.fillRect(W / 2 - 280 + i * 76, 340, 18, 130); }
  /* execs shoulder to shoulder */
  const ids = ['musk', 'huang', 'zuck', 'pichai', 'amodei', 'brockman'];
  const shoulders = 96;
  const x0 = W / 2 - (ids.length - 1) * shoulders / 2 - 40;
  ids.forEach((id, i) => {
    const sx = x0 + i * shoulders + Math.sin(t * 0.6 + i) * 2;
    drawFigure(c, id, sx, 620, 1.7, { pose: 'stand', look: Math.sin(t * 0.9 + i * 1.3) * 0.6, blink: Math.sin(t + i * 3) > 0.98 });
  });
  /* camera flashes */
  for (let i = 0; i < 5; i++) {
    const fl = Math.sin(t * 2.6 + i * 1.9);
    if (fl > 0.86) {
      const fx = 120 + i * 260, fy = 200 + Math.sin(i * 2) * 60;
      const fg = c.createRadialGradient(fx, fy, 2, fx, fy, 90);
      fg.addColorStop(0, 'rgba(255,255,255,0.7)'); fg.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = fg; c.fillRect(fx - 100, fy - 100, 200, 200);
    }
  }
  /* beats: 2 flag-driven + 1 random, one at a time */
  const beats = gaggleBeats(G.flags, G.ledger);
  const idx = Math.min(beats.length - 1, Math.floor(G.gaggleT / 5.5));
  const beat = beats[idx];
  const a = Math.min(1, (5.5 - (G.gaggleT % 5.5)) / 0.9);
  c.fillStyle = 'rgba(7,10,18,' + (0.8 * a) + ')';
  const bw2 = 780, bh2 = 96, bx2 = W / 2 - bw2 / 2, by2 = H - bh2 - 26;
  rr(c, bx2, by2, bw2, bh2, 10); c.fill();
  c.strokeStyle = 'rgba(201,162,39,' + (0.6 * a) + ')'; c.lineWidth = 1.5; rr(c, bx2, by2, bw2, bh2, 10); c.stroke();
  c.fillStyle = 'rgba(232,201,106,' + a + ')'; c.font = 'bold 14px Georgia, serif'; c.textAlign = 'left';
  c.fillText(beat.who, bx2 + 24, by2 + 28);
  c.fillStyle = 'rgba(245,239,221,' + a + ')'; c.font = 'italic 18px Georgia, serif';
  wrapText(c, beat.t, bx2 + 24, by2 + 56, bw2 - 48, 23, 'left');
  c.fillStyle = 'rgba(245,239,221,0.55)'; c.font = '13px Georgia, serif'; c.textAlign = 'right';
  c.fillText('the driveway gaggle', W - 110, 34);
  drawHUD(c);
}

  const R = auraReport();

  c.textAlign = 'left'; c.fillStyle = PAL.gold2; c.font = '600 44px Georgia, serif'; c.fillText(R.score + ' pts', rx + 178, 214);
  c.fillStyle = 'rgba(245,239,221,0.75)'; c.font = '15px Georgia, serif';
  c.fillText('Peak aura ' + Math.round(G.auraPeak) + '   ·   lowest ' + Math.round(G.auraStats.lowest), rx + 178, 244);
  c.fillText('Everything you did counted. Here is where it came from.', rx + 178, 270);
  const maxPts = 360;
  R.parts.forEach((p, i) => {

    c.fillStyle = PAL.cream; c.font = 'bold 14px Georgia, serif'; c.textAlign = 'left'; c.fillText(p.label, rx, y);
    c.fillStyle = 'rgba(245,239,221,0.6)'; c.font = '13px Georgia, serif'; c.fillText(p.detail, rx + 170, y);

    c.fillStyle = p.pts >= 0 ? PAL.gold2 : '#ff9a90'; c.font = 'bold 14px Georgia, serif'; c.textAlign = 'right'; c.fillText((p.pts > 0 ? '+' : '') + p.pts, rx + rw, y);
  });
}

function drawEnd(c, t) {
  if (!G.scored) finishRun();
  const e = ENDINGS[G.endingId];
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0c1220'); g.addColorStop(1, '#101b2d');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  /* left: the still, art variant */
  const fx = 56, fy = 84, fw = 430, fh = 300;
  c.fillStyle = '#080a10'; rr(c, fx - 14, fy - 14, fw + 28, fh + 28, 6); c.fill();
  c.strokeStyle = PAL.gold; c.lineWidth = 3; rr(c, fx - 14, fy - 14, fw + 28, fh + 28, 6); c.stroke();
  c.save(); rr(c, fx, fy, fw, fh, 3); c.clip();
  const still = ASSETS.img('end-' + G.endingId);
  if (still) drawCover(c, still, fx, fy, fw, fh); else drawEndingArt(c, t, e.art, fx, fy, fw, fh);
  c.restore();
  c.fillStyle = 'rgba(245,239,221,0.6)'; c.font = '12px Georgia, serif'; c.textAlign = 'center';
  c.fillText(e.art.toUpperCase() + ' — ' + e.title, fx + fw / 2, fy + fh + 36);
  /* title */
  const rx = fx + fw + 56, rw = W - rx - 56;
  c.fillStyle = PAL.gold2; c.font = '600 38px Georgia, serif'; c.textAlign = 'left';
  if (G.endTab === 'story') c.fillText(e.title, rx, 112);
  if (G.endTab === 'aura') {
    drawAuraReport(c, rx, rw);
  } else if (G.endTab === 'board') {
    drawBoard(c, rx, rw);
  } else {
    /* the story: each line starts where the last one ended, so wrapped lines never overlap */
    let y = 152;
    c.font = '16px Georgia, serif';
    endLines(G).forEach((l, i) => {
      c.fillStyle = i === 5 ? 'rgba(232,201,106,0.95)' : PAL.cream;
      y = wrapText(c, l, rx, y, rw, 22, 'left') + 36;
    });
    /* share card: fake X post, placed under the story */
    const sc = currentPost();
    const sw2 = Math.min(560, rw), sh2 = 96, sx2 = rx, sy2 = Math.max(y - 8, 380);
    c.fillStyle = '#0c1320'; rr(c, sx2, sy2, sw2, sh2, 10); c.fill();
    c.strokeStyle = '#26365a'; c.lineWidth = 1.5; rr(c, sx2, sy2, sw2, sh2, 10); c.stroke();
    c.fillStyle = '#e8c96a'; c.font = 'bold 13px Georgia, serif'; c.textAlign = 'left';
    c.fillText(sc.who, sx2 + 16, sy2 + 26);
    c.fillStyle = '#dfe5f5'; c.font = 'italic 14px Georgia, serif';
    wrapText(c, sc.txt, sx2 + 16, sy2 + 48, sw2 - 32, 18, 'left');
    c.fillStyle = '#8a9bb0'; c.font = '12px Georgia, serif';
    c.fillText('♥ ' + sc.likes + '   the internet reacts', sx2 + 16, sy2 + sh2 - 12);
    /* pick your post */
    c.fillStyle = PAL.gold2; c.font = 'bold 13px Georgia, serif'; c.textAlign = 'left';
    c.fillText('CHOOSE YOUR POST', rx, sy2 + sh2 + 28);
    const ow = Math.floor((rw - 24) / 3);
    POST_TONES.forEach((p, i) => uiBtn(rx + i * (ow + 12), sy2 + sh2 + 38, ow, 38, 'post_' + i, p.label, G.postPick === i));
    uiBtn(rx, sy2 + sh2 + 86, 190, 38, 'post_go', 'POST TO X  ↗', true);
    uiBtn(rx + 202, sy2 + sh2 + 86, 150, 38, 'post_copy', G.copied ? 'COPIED' : 'COPY TEXT');
  }
  /* buttons */
  const by = 632;
  uiBtn(rx, by, 120, 44, 'again', 'PLAY AGAIN');
  uiBtn(rx + 130, by, 170, 44, 'another', 'ANOTHER CEO');
  uiBtn(rx + 310, by, 170, 44, 'tab_aura', G.endTab === 'aura' ? 'THE STORY' : 'AURA REPORT', G.endTab !== 'aura');
  uiBtn(rx + 490, by, 170, 44, 'tab_board', G.endTab === 'board' ? 'THE STORY' : 'LEADERBOARD', G.endTab !== 'board');
}

/* ==================== assets.list.js ==================== */
/* generated by tools/hf-assets.mjs — do not edit by hand */
const ASSET_FILES = {};

/* ==================== assets.js ==================== */
/* ==================== assets.js — optional generated art ====================
   tools/hf-assets.mjs can make backgrounds, the menu/intro art and ending stills (never people) and
   lists them in assets.list.js. If a file is listed and loads, the game uses it; otherwise every
   scene falls back to its code-drawn art, so the game always works with zero assets. */
const ASSETS = (function () {
  const imgs = {};
  const files = (typeof ASSET_FILES === 'object' && ASSET_FILES) || {};
  if (typeof Image !== 'undefined') {
    Object.keys(files).forEach(function (id) {
      const im = new Image();
      im.onload = function () { imgs[id] = im; };
      im.src = 'assets/gen/' + files[id];
    });
  }
  return { img: function (id) { return imgs[id] || null; }, ids: Object.keys(files) };
})();

/* draw an image so it covers the box (cropping the overflow), like CSS object-fit: cover */
function drawCover(c, img, x, y, w, h) {
  const k = Math.max(w / img.width, h / img.height);
  const sw = w / k, sh = h / k;
  c.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, x, y, w, h);
}

/* ==================== cutscene.js ==================== */
/* ==================== cutscene.js — short, skippable scenes ====================
   A cutscene is { dur, draw(c, t) } where t is seconds since it began. Anything can skip it
   (click, Space, Enter, Escape) after a third of a second. Agents never see cutscenes: the agent
   interface calls the same game functions directly. */

const CUT_SEEN_KEY = 'wh_seen_arrival';
const ARRIVAL_CAST = ['musk', 'huang', 'zuck', 'pichai', 'amodei', 'brockman'];

function introSeen() {
  try { return localStorage.getItem(CUT_SEEN_KEY) === '1'; } catch (e) { return false; }
}
function startCutscene(id) {
  G.screen = 'cutscene';
  G.cut = { id: id, t: 0, flashed: -1 };
  if (id === 'desk') { G.signPhase = 'lines'; G.signLine = 0; }
}
function endCutscene() {
  const id = G.cut && G.cut.id;
  G.cut = null;
  if (id === 'arrival') {
    try { localStorage.setItem(CUT_SEEN_KEY, '1'); } catch (e) {}
    G.screen = 'cast';
  } else if (id === 'desk') {
    startSign();
  } else if (id === 'launch') {
    G.auraStats.rocket = true;
    addAura(auraScale(5), 'rocket launch', 'rocket');
    G.screen = 'room';
    toast('The rocket is gone. Several reporters write “tremendous” with a rocket emoji.');
  } else {
    G.screen = 'room';
  }
}
function updateCutscene(dt) {
  const cs = G.cut;
  if (!cs) { G.screen = 'title'; return; }
  cs.t += dt;
  if (cs.t >= CUTSCENES[cs.id].dur) endCutscene();
}
function skipCutscene() { if (G.cut && G.cut.t > 0.33) endCutscene(); }
function drawCutscene(c, t) {
  const cs = G.cut;
  if (!cs) { c.fillStyle = '#05070d'; c.fillRect(0, 0, W, H); return; }
  CUTSCENES[cs.id].draw(c, cs.t);
  /* skip hint */
  c.fillStyle = 'rgba(245,239,221,0.55)'; c.font = '13px Georgia, serif'; c.textAlign = 'right';
  c.fillText('click or press Space to skip', W - 26, H - 22);
}

const easeOut = (x) => 1 - Math.pow(1 - Math.max(0, Math.min(1, x)), 3);
const easeInOut = (x) => { x = Math.max(0, Math.min(1, x)); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const fadeWindow = (t, a, b, f) => Math.max(0, Math.min(1, Math.min((t - a) / f, (b - t) / f)));   /* 0→1→0 between a and b */

/* a title card: lines fade in and out over [a, b] */
function cutTitle(c, text, y, t, a, b, size, italic) {
  const k = fadeWindow(t, a, b, 0.6);
  if (k <= 0) return;
  c.fillStyle = 'rgba(245,239,221,' + (0.95 * k) + ')';
  c.font = (italic ? 'italic ' : '600 ') + size + 'px Georgia, serif'; c.textAlign = 'center';
  c.fillText(text, W / 2, y - (1 - k) * -8);
}

function drawMotorcadeCar(c, x, y, lead, t) {
  /* headlight cones */
  const g = c.createLinearGradient(x + 70, y, x + 330, y);
  g.addColorStop(0, 'rgba(255,238,200,0.5)'); g.addColorStop(1, 'rgba(255,238,200,0)');
  c.fillStyle = g;
  c.beginPath(); c.moveTo(x + 70, y - 8); c.lineTo(x + 340, y - 46); c.lineTo(x + 340, y + 36); c.lineTo(x + 70, y + 8); c.closePath(); c.fill();
  /* body */
  c.fillStyle = '#07090e'; rr(c, x - 78, y - 24, 156, 40, 12); c.fill();
  c.fillStyle = '#11151d'; rr(c, x - 44, y - 40, 92, 24, 9); c.fill();
  c.fillStyle = 'rgba(160,190,230,0.18)'; rr(c, x - 38, y - 36, 80, 14, 6); c.fill();
  c.fillStyle = '#0a0c11'; c.beginPath(); c.arc(x - 44, y + 18, 11, 0, 7); c.fill(); c.beginPath(); c.arc(x + 44, y + 18, 11, 0, 7); c.fill();
  c.fillStyle = 'rgba(255,245,220,0.95)'; c.beginPath(); c.arc(x + 74, y - 8, 4, 0, 7); c.fill();
  if (lead) {                                                   /* sirens */
    const on = Math.sin(t * 22) > 0;
    c.fillStyle = on ? 'rgba(230,50,60,0.9)' : 'rgba(60,110,240,0.9)';
    c.beginPath(); c.arc(x - 6, y - 42, 5, 0, 7); c.fill();
    const sg = c.createRadialGradient(x - 6, y - 42, 2, x - 6, y - 42, 70);
    sg.addColorStop(0, on ? 'rgba(230,50,60,0.35)' : 'rgba(60,110,240,0.35)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = sg; c.fillRect(x - 80, y - 110, 160, 140);
  }
}

const CUTSCENES = {
  /* ---- THE LAUNCH: the lawn demo, a countdown, lift-off ---- */
  launch: {
    dur: 9,
    draw(c, t) {
      const lift = Math.max(0, t - 3.4), y = 640 - lift * lift * 62;
      const shake = t > 3.2 && t < 7 ? Math.sin(t * 90) * Math.min(6, (t - 3.2) * 5) : 0;
      c.save(); c.translate(shake * 0.6, shake);
      const sky = c.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#070b18'); sky.addColorStop(0.7, '#3a3060'); sky.addColorStop(1, '#f0924f');
      c.fillStyle = sky; c.fillRect(-20, -20, W + 40, H + 40);
      for (let i = 0; i < 70; i++) { c.fillStyle = 'rgba(245,239,221,' + (0.25 + 0.3 * Math.sin(t + i)) + ')'; c.fillRect((i * 211) % W, (i * 97) % 380, 2, 2); }
      c.fillStyle = '#0d1a14'; for (let x = -20; x < W + 40; x += 44) { const h = 40 + ((x * 7) % 30); c.beginPath(); c.moveTo(x, 620); c.lineTo(x + 22, 620 - h); c.lineTo(x + 44, 620); c.fill(); }
      c.fillStyle = '#173a22'; c.fillRect(-20, 620, W + 40, 120);
      /* smoke blooms from the pad */
      if (t > 3.2) for (let i = 0; i < 16; i++) {
        const k = Math.min(1, (t - 3.2) / 4), a = (1 - k) * 0.5, sx = 640 + Math.sin(i * 2.1) * (60 + k * 300), sr = 30 + k * 90 + (i % 4) * 14;
        c.fillStyle = 'rgba(235,225,210,' + a + ')'; c.beginPath(); c.arc(sx, 636 - (i % 3) * 8, sr, 0, 7); c.fill();
      }
      drawRocket(c, 640, y, 1.6 + lift * 0.02, t, t > 3.4 ? Math.min(1, (t - 3.4) / 1.2) : 0);
      c.restore();
      /* countdown, then the word */
      const cd = ['3', '2', '1'];
      for (let i = 0; i < 3; i++) cutTitle(c, cd[i], 300, t, 0.2 + i * 0.95, 0.2 + i * 0.95 + 0.9, 140, false);
      cutTitle(c, 'LIFT-OFF', 200, t, 3.5, 7.5, 64, false);
      cutTitle(c, 'SPACEX · SOUTH LAWN DEMO', 120, t, 0.3, 3.1, 24, true);
      if (t > 8) { c.fillStyle = 'rgba(5,7,13,' + Math.min(1, (t - 8)) + ')'; c.fillRect(0, 0, W, H); }
      if (G.cut && G.cut.flashed < 0 && t > 3.4) { G.cut.flashed = 1; sfx('shutter'); }
    }
  },

  /* ---- THE ARRIVAL: motorcade, doors, six people in, a one-line promise ---- */
  arrival: {
    dur: 12,
    draw(c, t) {
      const d = 12;
      /* slow push-in on everything */
      const k = 1 + 0.06 * (t / d);
      c.save(); c.translate(W / 2, H * 0.56); c.scale(k, k); c.translate(-W / 2, -H * 0.56);
      const bg = ASSETS.img('arrival-bg');
      if (bg) drawCover(c, bg, -40, -30, W + 80, H + 60);
      else {
        /* night sky + stars */
        const sky = c.createLinearGradient(0, 0, 0, H * 0.7);
        sky.addColorStop(0, '#04060c'); sky.addColorStop(1, '#16223d');
        c.fillStyle = sky; c.fillRect(-40, -30, W + 80, H + 60);
        for (let i = 0; i < 70; i++) {
          const sx = (i * 197) % W, sy = (i * 83) % 260, tw = 0.5 + 0.5 * Math.sin(t * 1.4 + i);
          c.fillStyle = 'rgba(245,239,221,' + (0.15 + 0.35 * tw) + ')'; c.fillRect(sx, sy, 2, 2);
        }
        /* the residence: wings, portico, columns, lit windows */
        c.fillStyle = '#0d1424'; c.fillRect(120, 300, W - 240, 220);
        c.fillStyle = '#121b30';
        c.beginPath(); c.moveTo(380, 300); c.lineTo(W / 2, 214); c.lineTo(W - 380, 300); c.closePath(); c.fill();
        c.fillStyle = '#1a2640'; c.fillRect(380, 300, W - 760, 220);
        for (let i = 0; i < 6; i++) { c.fillStyle = '#232f4d'; c.fillRect(410 + i * 80, 308, 22, 212); }
        for (let i = 0; i < 9; i++) {
          const lit = 0.6 + 0.4 * Math.sin(t * 0.8 + i * 1.7);
          c.fillStyle = 'rgba(255,205,120,' + (0.35 + 0.35 * lit) + ')';
          c.fillRect(150 + i * 28, 340, 14, 30); c.fillRect(150 + i * 28, 410, 14, 30);
          c.fillRect(W - 150 - 14 - i * 28, 340, 14, 30); c.fillRect(W - 150 - 14 - i * 28, 410, 14, 30);
        }
        /* steps and plaza */
        for (let i = 0; i < 4; i++) { c.fillStyle = 'rgba(60,70,98,' + (0.5 - i * 0.07) + ')'; c.fillRect(360 - i * 20, 520 + i * 16, W - 720 + i * 40, 16); }
        const pl = c.createLinearGradient(0, 520, 0, H);
        pl.addColorStop(0, '#0b101c'); pl.addColorStop(1, '#05070d');
        c.fillStyle = pl; c.fillRect(-40, 584, W + 80, H);
      }
      /* motorcade sweeps across the plaza (0.3s–4.6s) */
      const mt = easeInOut((t - 0.3) / 4.3);
      for (let i = 0; i < 3; i++) drawMotorcadeCar(c, -260 + mt * (W + 760) - i * 300, 574 + i * 4, i === 0, t);
      /* six people walk in from the left and stop on their marks (3.6s onward) */
      ARRIVAL_CAST.forEach((id, i) => {
        const start = 3.4 + i * 0.7, mark = 330 + i * 124;
        const p = easeOut((t - start) / 3.0);
        const x = -60 + (mark + 60) * p;
        const walking = t > start && p < 0.985;
        if (t < start - 0.2) return;
        drawFigure(c, id, x, 596 - i % 2 * 6, 1.45, { pose: walking ? 'walk' : 'stand', phase: t * 7 + i * 1.3, look: 0.3, blink: Math.sin(t * 1.1 + i) > 0.99, t: t });
        if (!walking) {                                         /* name tag once they stop */
          const kk = Math.min(1, (t - (start + 3)) / 0.5);
          const nm = CAST.find(q => q.id === id).name.split(' ')[0].toUpperCase();
          c.fillStyle = 'rgba(7,10,18,' + (0.7 * kk) + ')'; rr(c, x - 44, 452, 88, 22, 6); c.fill();
          c.fillStyle = 'rgba(232,201,106,' + kk + ')'; c.font = 'bold 12px Georgia, serif'; c.textAlign = 'center';
          c.fillText(nm, x, 467);
        }
      });
      c.restore();
      /* camera flashes at the edges, once the guests arrive */
      for (let i = 0; i < 7; i++) {
        const ft = t * 2.3 + i * 1.9, f = Math.sin(ft);
        if (t > 3.5 && f > 0.9) {
          const fx = 90 + i * 180 + Math.sin(i * 5) * 60, fy = 470 + Math.sin(i * 3) * 80;
          const fg = c.createRadialGradient(fx, fy, 2, fx, fy, 110);
          fg.addColorStop(0, 'rgba(255,255,255,0.65)'); fg.addColorStop(1, 'rgba(255,255,255,0)');
          c.fillStyle = fg; c.fillRect(fx - 120, fy - 120, 240, 240);
          if (G.cut && Math.floor(ft / (Math.PI * 2)) !== G.cut.flashed && f > 0.97) { G.cut.flashed = Math.floor(ft / (Math.PI * 2)); sfx('shutter'); }
        }
      }
      /* letterbox + title cards */
      c.fillStyle = '#000'; c.fillRect(0, 0, W, 64); c.fillRect(0, H - 64, W, 64);
      cutTitle(c, 'SEPTEMBER 29, 2026', 330, t, 0.6, 3.6, 40, false);
      cutTitle(c, 'THE WHITE HOUSE', 372, t, 0.9, 3.6, 20, true);
      cutTitle(c, 'EAST ROOM · LUNCHEON · 12:40 PM', 120, t, 4.2, 8.2, 26, false);
      cutTitle(c, 'A one-letter typo is about to become history.', 330, t, 8.6, 11.6, 30, true);
      /* open from black, close to black */
      const a = Math.max(1 - t / 0.7, (t - (d - 0.7)) / 0.7);
      if (a > 0) { c.fillStyle = 'rgba(5,7,13,' + Math.min(1, a) + ')'; c.fillRect(0, 0, W, H); }
    }
  },

  /* ---- THE DESK: the pen comes up; the camera pushes in on the document ---- */
  desk: {
    dur: 3.2,
    draw(c, t) {
      const z = 1 + 0.26 * easeOut(t / 2.6);
      c.save(); c.translate(W / 2 + 70, 440); c.scale(z, z); c.translate(-(W / 2 + 70), -440);
      drawSign(c, G.t, 0.016);
      c.restore();
      /* vignette closes in */
      const v = c.createRadialGradient(W / 2 + 70, 440, 160, W / 2 + 70, 440, 760);
      v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,' + (0.25 + 0.5 * easeOut(t / 2.6)) + ')');
      c.fillStyle = v; c.fillRect(0, 0, W, H);
      cutTitle(c, 'THE PEN IS UP.', 150, t, 0.2, 2.5, 38, false);
      /* flash into the signing */
      const f = Math.max(0, (t - 2.55) / 0.65);
      if (f > 0) { c.fillStyle = 'rgba(255,255,255,' + Math.min(0.92, f) + ')'; c.fillRect(0, 0, W, H); }
      if (G.cut && G.cut.flashed < 0 && t > 2.55) { G.cut.flashed = 1; sfx('shutter'); }
    }
  }
};

ZONES.lawn.people = ZONES.lawn.people.filter((p) => !p.off);

const AURA_START = 55;

/* ------------------------------------------------------------------ state */
function worldReset(playerId) {
  const st = STARTS[playerId];
  G.zone = 'eastroom';
  G.px = st ? 60 + st.x * (W - 140) : 640; G.py = 720;
  G.cam = { x: 0, y: 0 };
  G.facing = 1; G.moveTo = null; G.focus = null; G.admiring = null; G.hs = null;
  G.aura = AURA_START; G.auraPeak = AURA_START; G.auraFloat = [];
  G.auraStats = { handshakes: {}, portraits: {}, chats: {}, talks: 0, presence: 0, alone: 0, rocket: false, press: 0, pressAsked: 0, lowest: AURA_START, log: {} };
  G.faded = 0; G.aloneT = 0; G.fieldWhy = '';
  G.npcs = {};
  for (const zid of Object.keys(ZONES)) for (const p of ZONES[zid].people) G.npcs[p.id] = { x: p.x, y: p.y, tx: p.x, ty: p.y, wait: 1 + (idHash(p.id) % 30) / 10, zone: zid, face: 1 };
}

function addAura(delta, why, key) {
  if (!delta) return;
  const before = G.aura;
  G.aura = Math.max(0, Math.min(100, G.aura + delta));
  G.auraPeak = Math.max(G.auraPeak, G.aura);
  G.auraStats.lowest = Math.min(G.auraStats.lowest, G.aura);
  const k = key || why;
  G.auraStats.log[k] = (G.auraStats.log[k] || 0) + (G.aura - before);
  G.auraFloat.push({ text: (delta > 0 ? '+' : '') + Math.round(delta * 10) / 10 + ' ' + why, t: 0, good: delta > 0 });
  if (G.auraFloat.length > 6) G.auraFloat.shift();
}
/* the meter changes how people treat you */
function auraTier() { return G.aura >= 80 ? 'radiant' : G.aura <= 25 ? 'fading' : 'steady'; }
function auraScale(base) {
  if (base > 0 && G.aura >= 80) return Math.round(base * 1.25);
  if (base > 0 && G.aura <= 25) return Math.round(base * 0.75);
  if (base < 0 && G.aura <= 25) return Math.round(base * 1.25);
  return base;
}

/* ------------------------------------------------------------------ geometry */
function rectHit(r, x, y, pad) { return x > r.x - pad && x < r.x + r.w + pad && y > r.y - pad && y < r.y + r.h + pad; }
function walkable(z, x, y) {
  const f = z.floor;
  if (x < f.x0 || x > f.x1 || y < f.y0 || y > f.y1) return false;
  for (const o of z.obstacles) if (rectHit(o, x, y, 14)) return false;
  return true;
}
function stepToward(z, x, y, dx, dy) {
  /* axis-separated so you slide along walls and furniture instead of sticking */
  let nx = x + dx, ny = y;
  if (!walkable(z, nx, ny)) nx = x;
  ny = y + dy;
  if (!walkable(z, nx, ny)) ny = y;
  return { x: nx, y: ny };
}
function npcDef(id) { return AMBIENT_PEOPLE[id] || TALKER_NAME[id] || null; }
function npcPos(zone, id) { const n = G.npcs[id]; return n && n.zone === zone ? n : null; }

/* what you can interact with here, nearest first */
function worldTargets() {
  const z = ZONES[G.zone], out = [];
  if (G.zone === 'eastroom') {
    for (const s of SEATS) {
      if (s.id === G.playerId) continue;
      const sx = seatX(s);
      out.push({ kind: 'signer', id: s.id, x: sx, y: 650, r: 118, label: s.id === 'trump' ? 'THE PRESIDENT' : CAST.find((k) => k.id === s.id).name.toUpperCase(), person: true });
    }
  }
  for (const p of z.people) {
    const n = G.npcs[p.id];
    const def = npcDef(p.id);
    out.push({ kind: p.talkId ? 'talker' : 'ambient', id: p.id, x: n.x, y: n.y, r: 96, label: def.name.toUpperCase(), person: true });
  }
  if (G.zone === 'hallway') for (let i = 0; i < PORTRAITS.length; i++) out.push({ kind: 'portrait', id: PORTRAITS[i].id, x: portraitX(i), y: 586, r: 96, label: PORTRAITS[i].name.toUpperCase() });
  if (G.zone === 'lawn') {
    out.push({ kind: 'rocket', id: 'rocket', x: 640, y: 690, r: 130, label: 'THE ROCKET' });
    out.push({ kind: 'press', id: 'press', x: 640, y: 1090, r: 130, label: 'THE PODIUM' });
  }
  for (const p of z.portals) out.push({ kind: 'portal', id: p.id, x: p.x, y: p.y, r: p.r, label: p.label, portal: p });
  return out;
}
const portraitX = (i) => 250 + i * 270;

/* ------------------------------------------------------------------ update */
function worldUpdate(dt) {
  const z = ZONES[G.zone];
  G.roomT += dt;
  const k = keys;
  const left = k['arrowleft'] || k['a'], right = k['arrowright'] || k['d'], up = k['arrowup'] || k['w'], down = k['arrowdown'] || k['s'];
  const busy = !!G.hs || !!G.admiring;
  let dx = (right ? 1 : 0) - (left ? 1 : 0), dy = (down ? 1 : 0) - (up ? 1 : 0);
  if (busy && (dx || dy)) { G.admiring = null; if (G.hs && G.hs.t > 0.15) G.hs = null; }
  const SPEED = 215;
  if (dx || dy) { G.moveTo = null; const m = Math.hypot(dx, dy); dx /= m; dy /= m; }
  else if (G.moveTo && !busy) {
    const tx = G.moveTo.x - G.px, ty = G.moveTo.y - G.py, d = Math.hypot(tx, ty);
    if (d < 8) { const cb = G.moveTo.then; G.moveTo = null; if (cb) cb(); }
    else { dx = tx / d; dy = ty / d; }
  }
  let vx = 0, vy = 0;
  if ((dx || dy) && !G.hs) {
    const p = stepToward(z, G.px, G.py, dx * SPEED * dt, dy * SPEED * dt);
    vx = (p.x - G.px) / Math.max(dt, 1e-6); vy = (p.y - G.py) / Math.max(dt, 1e-6);
    if (Math.abs(vx) + Math.abs(vy) < 8 && G.moveTo) G.moveTo = null;          /* pinned against something */
    G.px = p.x; G.py = p.y;
  }
  G.vx = vx; G.vy = vy;
  const moving = Math.abs(vx) + Math.abs(vy) > 6;
  G.walkPhase = moving ? G.walkPhase + Math.hypot(vx, vy) * 0.036 * dt * 60 / 60 * 1.2 : 0;
  if (Math.abs(vx) > 6) G.facing = vx < 0 ? -1 : 1;
  G.playerX = G.px / z.w;                                                          /* kept for the ambient jokes */

  /* camera */
  const tcx = Math.max(0, Math.min(z.w - W, G.px - W / 2)), tcy = Math.max(0, Math.min(z.h - H, G.py - H * 0.62));
  G.cam.x += (tcx - G.cam.x) * Math.min(1, dt * 5); G.cam.y += (tcy - G.cam.y) * Math.min(1, dt * 5);

  /* people wander a little */
  for (const p of z.people) {
    const n = G.npcs[p.id];
    n.wait -= dt;
    if (n.wait <= 0) {
      const h = idHash(p.id + ':' + Math.floor(G.t / 3));
      const a = (h % 628) / 100, r = ((h >> 10) % 100) / 100 * p.wander;
      const tx = p.x + Math.cos(a) * r, ty = p.y + Math.sin(a) * r * 0.45;
      if (walkable(z, tx, ty)) { n.tx = tx; n.ty = ty; }
      n.wait = 2.5 + (h % 40) / 10;
    }
    const ddx = n.tx - n.x, ddy = n.ty - n.y, dd = Math.hypot(ddx, ddy);
    if (dd > 3) { const sp = Math.min(dd, 38 * dt); n.x += ddx / dd * sp; n.y += ddy / dd * sp; n.walking = true; if (Math.abs(ddx) > 2) n.face = ddx < 0 ? -1 : 1; } else n.walking = false;
  }

  if (G.human && !G.sealed) {
    G.clock -= dt;
    if (G.clock <= 0) { G.clock = 0; G.sealed = true; toast('The press conference is starting. Everyone to the lawn!'); startPressConference(true); return; }
  }
  if (G.human && !G.doorHint && G.roomT > 7) { G.doorHint = true; toast('Doors: far left = the Gallery, far right = the South Lawn. Click one or walk into it.'); }
  /* what is in front of you */
  const targets = worldTargets();
  let best = null, bd = 1e9;
  for (const t of targets) {
    const d = Math.hypot(t.x - G.px, (t.y - G.py) * 1.6);
    if (d < t.r && d < bd) { best = t; bd = d; }
  }
  G.focus = best;
  if (best && best.kind === 'portal' && !busy && Math.hypot(best.x - G.px, (best.y - G.py) * 0.8) < 48) { enterZone(best.portal.to, best.portal.at); return; }

  /* handshake timing window */
  if (G.hs) updateHandshake(dt);
  /* admiring a portrait */
  if (G.admiring) {
    G.admiring.t += dt;
    if (!G.focus || G.focus.id !== G.admiring.id) G.admiring = null;
    else if (G.admiring.t >= 2.0) finishAdmire(G.admiring.id);
  }

  /* ---------- aura dynamics ---------- */
  let rate = -0.35;                                                                 /* it drains: keep it up */
  const f = z.field(G.px, G.py);
  rate += f.rate; G.fieldWhy = f.why;
  if (f.rate > 0.4) G.auraStats.presence += dt;
  let near = false;
  for (const t of targets) if (t.person && Math.hypot(t.x - G.px, t.y - G.py) < 190) { near = true; break; }
  G.aloneT = near ? 0 : G.aloneT + dt;
  if (G.aloneT > 6) { rate -= 0.5; G.auraStats.alone += dt; G.fieldWhy = 'lingering alone'; }
  G.aura = Math.max(0, Math.min(100, G.aura + rate * dt));
  G.auraStats.lowest = Math.min(G.auraStats.lowest, G.aura);
  G.auraPeak = Math.max(G.auraPeak, G.aura);
  if (G.aura <= 0) { G.faded += dt; if (G.faded > 4) { G.endingId = 'faded'; G.screen = 'end'; sfx('bad'); } } else G.faded = 0;
  for (const fl of G.auraFloat) fl.t += dt;
  G.auraFloat = G.auraFloat.filter((fl) => fl.t < 2.4);
  if (auraTier() === 'radiant' && !G.flags.__radiant) { G.flags.__radiant = true; toast('Your aura is radiant. People lean in. Gains are bigger.'); }
  if (auraTier() === 'fading' && !G.flags.__fading) { G.flags.__fading = true; toast('Your aura is fading. People look past you. Go be seen.'); }
  if (auraTier() === 'steady') { G.flags.__radiant = false; G.flags.__fading = false; }
}

function enterZone(zid, at) {
  G.zone = zid; G.px = at.x; G.py = at.y; G.moveTo = null; G.focus = null; G.admiring = null;
  G.cam.x = Math.max(0, Math.min(ZONES[zid].w - W, G.px - W / 2)); G.cam.y = Math.max(0, Math.min(ZONES[zid].h - H, G.py - H * 0.62));
  fadeT = 0;
  toast(ZONES[zid].name);
  sfx('ui');
}

/* ------------------------------------------------------------------ interactions */
function interactPrimary() {
  const f = G.focus;
  if (!f || G.hs || G.admiring) { if (G.hs) handshakePress(); return; }
  if (f.kind === 'signer') {
    if (f.id === 'trump') { if (G.talksDone.length >= 3) startCutscene('desk'); else toast('The pen comes at the signing. Mingle first — three conversations.'); return; }
    if (G.talksDone.length >= 3 && G.talksDone.indexOf(f.id) === -1) { toast('Three conversations is the rule. The pen is up.'); return; }
    openTalk(f.id);
  } else if (f.kind === 'talker') { openTalk('tombrown'); }
  else if (f.kind === 'ambient') chatWith(f.id);
  else if (f.kind === 'portrait') G.admiring = { id: f.id, t: 0 };
  else if (f.kind === 'portal') enterZone(f.portal.to, f.portal.at);
  else if (f.kind === 'rocket') { if (G.auraStats.rocket) toast('The rocket has already left. The pad is still warm.'); else startCutscene('launch'); }
  else if (f.kind === 'press') startPressConference();
}
function interactHandshake() {
  const f = G.focus;
  if (G.hs) { handshakePress(); return; }
  if (!f || !f.person || G.admiring) return;
  startHandshake(f.id);
}

/* a quick chat with someone who is not at the table */
function chatWith(id) {
  const def = AMBIENT_PEOPLE[id]; if (!def) return;
  const st = G.auraStats.chats;
  const n = (st[id] || 0);
  toast(def.name + ': ' + def.chat[n % def.chat.length]);
  st[id] = n + 1;
  if (n === 0) addAura(auraScale(def.rank >= 3 ? 3 : 2), 'chat with ' + def.name.split(' ').pop().toLowerCase(), 'chats');
  else if (n >= 3) addAura(-1, 'overstayed', 'chats');
  sfx('talk');
}

/* ---- handshake: a ring closes on the hand; press F/E/Space/click when it meets the circle ---- */
function startHandshake(id) {
  const rank = SIGNER_RANK[id] || (AMBIENT_PEOPLE[id] ? AMBIENT_PEOPLE[id].rank : 1);
  G.hs = { id: id, t: 0, dur: 1.5, ideal: 1.05, rank: rank, done: null };
  G.moveTo = null;
}
function handshakePress() {
  const h = G.hs; if (!h || h.done) return;
  const e = Math.abs(h.t - h.ideal);
  const first = !G.auraStats.handshakes[h.id];
  if (e < 0.11) h.done = { q: 'perfect', d: first ? h.rank + 2 : 0, text: 'firm, brief, perfect' };
  else if (e < 0.26) h.done = { q: 'good', d: first ? Math.max(1, Math.round(h.rank * 0.6)) : 0, text: 'solid shake' };
  else h.done = { q: 'miss', d: -2, text: h.t < h.ideal ? 'too eager' : 'left hanging' };
  finishHandshake();
}
function updateHandshake(dt) {
  const h = G.hs; if (!h) return;
  h.t += dt;
  if (!h.done && h.t > h.dur) { h.done = { q: 'miss', d: -2, text: 'left hanging' }; finishHandshake(); }
  if (h.done) { h.hold = (h.hold || 0) + dt; if (h.hold > 0.7) G.hs = null; }
}
function finishHandshake() {
  const h = G.hs, first = !G.auraStats.handshakes[h.id];
  if (first && h.done.q !== 'miss') G.auraStats.handshakes[h.id] = h.done.q;
  else if (!first && h.done.q !== 'miss') h.done = { q: 'repeat', d: -1, text: 'again? weird' };
  if (h.done.d) addAura(auraScale(h.done.d), 'handshake: ' + h.done.text, 'handshakes');
  sfx(h.done.q === 'miss' || h.done.q === 'repeat' ? 'bad' : 'good');
}

function finishAdmire(id) {
  G.admiring = null;
  const idx = PORTRAITS.findIndex((p) => p.id === id);
  if (idx < 0 || G.auraStats.portraits[id]) { toast('You have admired this one. It remembers.'); return; }
  G.auraStats.portraits[id] = true;
  toast(PORTRAITS[idx].name + ' — ' + PORTRAITS[idx].quip);
  addAura(auraScale(3), 'admired ' + PORTRAITS[idx].name.split(' ').pop(), 'portraits');
  sfx('good');
  if (Object.keys(G.auraStats.portraits).length === PORTRAITS.length) { addAura(10, 'connoisseur bonus', 'portraits'); toast('You admired every president. Aura earned. The docent nods once.'); }
}

/* ---- click-to-move: click the ground to walk there, click a person or a thing to walk up and use it ---- */
function worldClick(sx, sy) {
  if (G.hs) { handshakePress(); return; }
  const wx = sx + G.cam.x, wy = sy + G.cam.y, z = ZONES[G.zone];
  const targets = worldTargets();
  let hit = null, bd = 1e9;
  for (const t of targets) {
    if (t.kind === 'portal' && Math.abs(wx - t.x) < 90 && wy > t.y - 520 && wy < t.y + 80) { hit = t; bd = 0; break; }
    const body = t.person ? 70 : (t.kind === 'portrait' ? 130 : 90);
    const cy = t.person ? t.y - 60 : (t.kind === 'portrait' ? 330 : t.y - 40);
    const d = Math.hypot(t.x - wx, (cy - wy) * (t.kind === 'portrait' ? 0.6 : 1));
    if (d < body && d < bd) { hit = t; bd = d; }
  }
  if (hit) {
    const dist = Math.hypot(hit.x - G.px, (hit.y - G.py) * 1.6);
    if (dist < hit.r) { G.focus = hit; interactPrimary(); return; }
    const spot = nearestWalkable(z, hit.x, hit.y + (hit.kind === 'portrait' ? 0 : 36));
    G.moveTo = { x: spot.x, y: spot.y, then: () => { const t2 = worldTargets().find((q) => q.id === hit.id); if (t2) { G.focus = t2; interactPrimary(); } } };
    return;
  }
  const f = z.floor;
  if (wx > f.x0 - 40 && wx < f.x1 + 40 && wy > f.y0 - 40 && wy < f.y1 + 40) {
    const spot = nearestWalkable(z, Math.max(f.x0, Math.min(f.x1, wx)), Math.max(f.y0, Math.min(f.y1, wy)));
    G.moveTo = { x: spot.x, y: spot.y };
  }
}
function nearestWalkable(z, x, y) {
  if (walkable(z, x, y)) return { x: x, y: y };
  for (let r = 10; r < 260; r += 10) for (let a = 0; a < 6.28; a += 0.5) { const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r; if (walkable(z, px, py)) return { x: px, y: py }; }
  return { x: G.px, y: G.py };
}

/* ------------------------------------------------------------------ the report */
function auraReport() {
  const S = G.auraStats;
  const hs = Object.keys(S.handshakes).length, ps = Object.keys(S.portraits).length;
  const parts = [
    { id: 'presence',  label: 'Presence',        detail: Math.round(S.presence) + 's in power positions', pts: Math.round(S.presence * 3) },
    { id: 'hands',     label: 'Handshakes',      detail: hs + ' good ones',                                 pts: hs * 45 },
    { id: 'art',       label: 'Art appreciation',detail: ps + ' of ' + PORTRAITS.length + ' portraits',     pts: ps * 40 + (ps === PORTRAITS.length ? 80 : 0) },
    { id: 'talk',      label: 'Conversations',   detail: S.talks + ' real talks',                           pts: S.talks * 60 },
    { id: 'press',     label: 'Press handling',  detail: S.pressAsked + ' questions answered',              pts: Math.round(S.press) },
    { id: 'rocket',    label: 'The rocket',      detail: S.rocket ? 'watched it leave' : 'never looked up', pts: S.rocket ? 70 : 0 },
    { id: 'aura',      label: 'Final aura',      detail: Math.round(G.aura) + ' (peak ' + Math.round(G.auraPeak) + ')', pts: Math.round(G.aura * 4) },
    { id: 'alone',     label: 'Lingering alone', detail: Math.round(S.alone) + 's by yourself',             pts: -Math.round(S.alone * 3) }
  ];
  const score = Math.max(0, parts.reduce((a, p) => a + p.pts, 0));
  const rank = score >= 1100 ? 'S' : score >= 850 ? 'A' : score >= 600 ? 'B' : score >= 380 ? 'C' : 'D';
  const title = { S: 'UNTOUCHABLE', A: 'MAGNETIC', B: 'WELL-KNOWN', C: 'FORGETTABLE-ISH', D: 'BACKGROUND EXTRA' }[rank];
  return { parts: parts, score: score, rank: rank, title: title };
}

/* ---- text helpers ---- */
function wrapCount(c, text, maxW) {
  const words = String(text).split(' ');
  let lines = 1, cur = '';
  for (const wd of words) {
    const test = cur ? cur + ' ' + wd : wd;
    if (c.measureText(test).width > maxW && cur) { lines++; cur = wd; } else { cur = test; }
  }
  return lines;
}
function wrapText(c, text, x, y, maxW, lineH, align) {
  /* Draws wrapped text and returns the y of its last line. lineH defaults to 18. align ('left'|'center'|'right')
     overrides the canvas alignment for this call only: x is then the left edge, centre, or right edge. */
  lineH = lineH || 18;
  const prev = c.textAlign;
  if (align) c.textAlign = align;
  const words = String(text).split(' ');
  let cur = '', yy = y;
  for (const wd of words) {
    const test = cur ? cur + ' ' + wd : wd;
    if (c.measureText(test).width > maxW && cur) { c.fillText(cur, x, yy); yy += lineH; cur = wd; } else { cur = test; }
  }
  if (cur) c.fillText(cur, x, yy);
  c.textAlign = prev;
  return yy;
}
function wrapTextLines(c, text, maxW) {
  const words = String(text).split(' ');
  const lines = []; let cur = '';
  for (const wd of words) {
    const test = cur ? cur + ' ' + wd : wd;
    if (c.measureText(test).width > maxW && cur) { lines.push(cur); cur = wd; } else { cur = test; }
  }
  if (cur) lines.push(cur);
  return lines;
}

/* ---- toast: one at a time, dies ---- */
function toast(t) { G.toast = { t: t, born: G.t }; }

/* ---- audio: tasteful and quiet ---- */
let AC = null, muted = false;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  return AC;
}
function tone(f, dur, type, gain, delay) {
  const a = ac(); if (!a || muted) return;
  try {
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.value = f; g.gain.value = gain || 0.06;
    o.connect(g); g.connect(a.destination);
    const t0 = a.currentTime + (delay || 0);
    o.start(t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.stop(t0 + dur);
  } catch (e) {}
}
function noiseBurst(dur, gain, delay) {
  const a = ac(); if (!a || muted) return;
  try {
    const len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = a.createBufferSource(); src.buffer = buf;
    const g = a.createGain(); g.gain.value = gain || 0.08;
    src.connect(g); g.connect(a.destination);
    src.start(a.currentTime + (delay || 0));
  } catch (e) {}
}
function sfx(name) {
  if (muted) return;
  if (name === 'ui') tone(520, 0.06, 'sine', 0.04);
  else if (name === 'talk') tone(340, 0.05, 'sine', 0.035);
  else if (name === 'good') { tone(523, 0.09, 'sine', 0.05); tone(659, 0.12, 'sine', 0.045, 0.07); }
  else if (name === 'bad') tone(180, 0.16, 'sawtooth', 0.05);
  else if (name === 'shutter') noiseBurst(0.07, 0.1);
  else if (name === 'pen') noiseBurst(0.2, 0.03);
  else if (name === 'stamp') tone(140, 0.08, 'square', 0.06);
  else if (name === 'sign') { tone(392, 0.15, 'sine', 0.05); tone(494, 0.2, 'sine', 0.045, 0.1); }
}
function toggleMute() { muted = !muted; }

/* ---- run setup: ACT I is where your body is at the table ---- */
function resetRun(playerId) {
  G.playerId = playerId;
  G.talksDone = [];
  G.tomDone = false;
  G.flags = {}; stateFlags = G.flags;

  G.invitedMic = null;
