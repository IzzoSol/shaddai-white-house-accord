/* Seeded RNG (mulberry32) — deterministic runs, testable. */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* provisional ending after Act II; signing can flip it one step */
function computeEndingId(state) {
  const L = state.ledger, f = state.flags;
  if (f.zuckCaption && L.drama >= 2) return 'glassesLeak';
  if (f.elonPosted && L.sam) return 'promptOff';
  if (L.typoAlive && L.meme >= 3) return 'viralTypo';
  if (f.darioTesting && L.substance >= 3 && L.optics <= 1) return 'safetyCaucus';
  if (f.sandDone && L.optics >= 2) return 'sandSermon';
  if (state.playerId === 'brockman' && !L.sam) return 'absentCEO';
  if (L.optics >= 3 && L.substance >= 2 && L.drama <= 1 && !L.typoAlive) return 'perfect';
  if (L.optics >= 3 && L.substance <= 1) return 'constitution';
  if (L.meme >= 2) return 'viralTypo';
  if (L.substance >= 2) return 'safetyCaucus';
  return 'constitution';
}

/* rounded-rect path */
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, (n >> 16) + amt));
  const g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt));
  const b = Math.max(0, Math.min(255, (n & 255) + amt));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* ---- head (drawn at origin, feet baseline is +H) ---- */
function drawHead(c, a, s, blink, look) {
  const hw = 13 * s;               // half-width of skull
  c.save();
  c.translate(0, -62 * s);
  if (look) c.translate(look * 1.2 * s, 0);

  /* ears */
  c.fillStyle = shade(a.skin, -26);
  c.beginPath(); c.ellipse(-hw - 1 * s, 1 * s, 2.4 * s, 3.6 * s, 0, 0, 7); c.fill();
  c.beginPath(); c.ellipse(hw + 1 * s, 1 * s, 2.4 * s, 3.6 * s, 0, 0, 7); c.fill();

  /* skull + jaw */
  c.fillStyle = a.skin;
  c.beginPath();
  c.moveTo(-hw, -2 * s);
  c.bezierCurveTo(-hw, -16 * s, hw, -16 * s, hw, -2 * s);          // cranium
  c.bezierCurveTo(hw, 8 * s, 6 * s, 13 * s, 0, 13 * s);            // right jaw
  c.bezierCurveTo(-6 * s, 13 * s, -hw, 8 * s, -hw, -2 * s);        // left jaw
  c.fill();
  /* subtle side shade */
  c.fillStyle = 'rgba(0,0,0,0.07)';
  c.beginPath();
  c.moveTo(hw - 4 * s, -13 * s);
  c.bezierCurveTo(hw + 2 * s, -4 * s, hw - 2 * s, 8 * s, 2 * s, 12 * s);
  c.bezierCurveTo(hw - 1 * s, 6 * s, hw - 5 * s, -4 * s, hw - 4 * s, -13 * s);
  c.fill();

  /* hair styles */
  c.fillStyle = a.hairC;
  if (a.hair === 'swoop') {                       // Trump
    c.beginPath();
    c.moveTo(-hw - 1.5 * s, -1 * s);
    c.bezierCurveTo(-hw - 3 * s, -14 * s, -6 * s, -19 * s, 2 * s, -18 * s);
    c.bezierCurveTo(10 * s, -17.5 * s, hw + 3 * s, -13 * s, hw + 1 * s, -4 * s);
    c.bezierCurveTo(hw - 2 * s, -9 * s, 4 * s, -12 * s, -2 * s, -10 * s);
    c.bezierCurveTo(-7 * s, -8.5 * s, -10 * s, -5 * s, -hw - 1.5 * s, -1 * s);
    c.fill();
  } else if (a.hair === 'bald') {
    c.fillStyle = 'rgba(0,0,0,0.05)';
    c.beginPath(); c.ellipse(0, -14.5 * s, 9 * s, 3.4 * s, 0, 0, 7); c.fill();
  } else if (a.hair === 'buzz') {
    c.beginPath();
    c.moveTo(-hw, -3 * s);
    c.bezierCurveTo(-hw - 1 * s, -14 * s, hw + 1 * s, -14 * s, hw, -3 * s);
    c.closePath(); c.fill();
  } else if (a.hair === 'curls') {
    c.beginPath();
    c.moveTo(-hw - 1 * s, -2 * s);
    c.bezierCurveTo(-hw - 2 * s, -15 * s, hw + 2 * s, -15 * s, hw + 1 * s, -2 * s);
    c.quadraticCurveTo(hw - 4 * s, -8 * s, 0, -8.5 * s);
    c.quadraticCurveTo(-hw + 4 * s, -8 * s, -hw - 1 * s, -2 * s);
    c.fill();
  } else if (a.hair === 'neat') {
    c.beginPath();
    c.moveTo(-hw, -3 * s);
    c.bezierCurveTo(-hw - 1.5 * s, -13.5 * s, hw + 1.5 * s, -13.5 * s, hw, -3 * s);
    c.quadraticCurveTo(hw - 6 * s, -10 * s, 0, -10.5 * s);
    c.quadraticCurveTo(-hw + 6 * s, -10 * s, -hw, -3 * s);
    c.fill();
  } else if (a.hair === 'short' || a.hair === 'side') {
    const side = a.hair === 'side';
    c.beginPath();
    c.moveTo(-hw - (side ? 1 : 0), -2 * s);
    c.bezierCurveTo(-hw - 1 * s, -14 * s, hw + (side ? 0 : 1) * 1, -14 * s, hw, -3.5 * s);
    c.quadraticCurveTo(0, -9 * s, -hw - (side ? 1 : 0), -2 * s);
    c.fill();
    if (side) { c.fillRect(-hw - 0.6 * s, -8 * s, 2 * s, 7 * s); }
  } else if (a.hair === 'long') {
    c.beginPath();
    c.moveTo(-hw - 2 * s, 12 * s);
    c.bezierCurveTo(-hw - 5 * s, -8 * s, -8 * s, -17 * s, 0, -17 * s);
    c.bezierCurveTo(8 * s, -17 * s, hw + 5 * s, -8 * s, hw + 2 * s, 12 * s);
    c.lineTo(hw - 3 * s, 12 * s);
    c.bezierCurveTo(hw, 0, 6 * s, -9 * s, 0, -9 * s);
    c.bezierCurveTo(-6 * s, -9 * s, -hw, 0, -hw + 3 * s, 12 * s);
    c.fill();
  }

  /* eyes */
  const ey = -3.4 * s, ex = 4.6 * s;
  c.strokeStyle = '#1a1613'; c.lineWidth = 1.15 * s; c.lineCap = 'round';
  if (blink) {
    c.beginPath(); c.moveTo(-ex - 2 * s, ey); c.lineTo(-ex + 2 * s, ey);
    c.moveTo(ex - 2 * s, ey); c.lineTo(ex + 2 * s, ey); c.stroke();
  } else {
    c.fillStyle = '#fff';
    c.beginPath(); c.ellipse(-ex, ey, 2.5 * s, 1.7 * s, 0, 0, 7); c.fill();
    c.beginPath(); c.ellipse(ex, ey, 2.5 * s, 1.7 * s, 0, 0, 7); c.fill();
    c.fillStyle = '#1a1613';
    c.beginPath(); c.arc(-ex + (look || 0) * 1.1 * s, ey, 1.05 * s, 0, 7); c.fill();
    c.beginPath(); c.arc(ex + (look || 0) * 1.1 * s, ey, 1.05 * s, 0, 7); c.fill();
  }
  /* brows */
  c.strokeStyle = shade(a.hairC, -18); c.lineWidth = 1.5 * s;
  c.beginPath(); c.moveTo(-ex - 2.6 * s, ey - 3.4 * s); c.lineTo(-ex + 2.2 * s, ey - 4 * s);
  c.moveTo(ex - 2.2 * s, ey - 4 * s); c.lineTo(ex + 2.6 * s, ey - 3.4 * s); c.stroke();

  /* nose */
  c.strokeStyle = shade(a.skin, -55); c.lineWidth = 1.2 * s;
  c.beginPath(); c.moveTo(0.4 * s, ey + 2 * s); c.quadraticCurveTo(1.6 * s, ey + 5 * s, -0.6 * s, ey + 6.4 * s); c.stroke();

  /* mouth by expression */
  c.strokeStyle = '#7a3a30'; c.lineWidth = 1.35 * s;
  c.beginPath();
  if (a.exp === 'smile')      { c.moveTo(-3 * s, 8.4 * s); c.quadraticCurveTo(0, 10.4 * s, 3 * s, 8.4 * s); }
  else if (a.exp === 'stiff') { c.moveTo(-2.6 * s, 8.8 * s); c.lineTo(2.6 * s, 8.8 * s); }
  else if (a.exp === 'wince') { c.moveTo(-2.8 * s, 9.4 * s); c.quadraticCurveTo(0, 7.6 * s, 2.8 * s, 9.4 * s); }
  else if (a.exp === 'preacher') { c.moveTo(-2.2 * s, 9 * s); c.quadraticCurveTo(0, 9.8 * s, 2.2 * s, 9 * s); }
  else                        { c.moveTo(-2.4 * s, 9 * s); c.lineTo(2.4 * s, 9 * s); }
  c.stroke();

  /* beard */
  if (a.beard) {
    c.fillStyle = shade(a.hairC, 10);
    c.beginPath();
    c.moveTo(-hw + 2 * s, 4 * s);
    c.bezierCurveTo(-hw + 3 * s, 12 * s, -3 * s, 13.6 * s, 0, 13.6 * s);
    c.bezierCurveTo(3 * s, 13.6 * s, hw - 3 * s, 12 * s, hw - 2 * s, 4 * s);
    c.bezierCurveTo(hw - 5 * s, 8 * s, 5 * s, 9.6 * s, 0, 9.6 * s);
    c.bezierCurveTo(-5 * s, 9.6 * s, -hw + 5 * s, 8 * s, -hw + 2 * s, 4 * s);
    c.fill();
  }
  /* glasses */
  if (a.glasses) {
    c.strokeStyle = '#20242c'; c.lineWidth = 1.05 * s;
    c.strokeRect(-ex - 3.2 * s, ey - 2.8 * s, 6.4 * s, 5.2 * s);
    c.strokeRect(ex - 3.2 * s, ey - 2.8 * s, 6.4 * s, 5.2 * s);
    c.beginPath(); c.moveTo(-ex + 3.2 * s, ey); c.lineTo(ex - 3.2 * s, ey); c.stroke();
    c.fillStyle = 'rgba(255,255,255,0.14)';
    c.beginPath(); c.ellipse(ex - 1 * s, ey - 1 * s, 2.2 * s, 1.4 * s, -0.5, 0, 7); c.fill();
  }
  c.restore();
}

/* ---- torso / suit (origin at hips) ---- */
function drawTorso(c, a, s, armPhase, pose) {
  const w = 21 * s;   // half shoulder width
  c.save();
  /* legs for standing poses */
  if (pose === 'stand' || pose === 'walk') {
    const swing = pose === 'walk' ? Math.sin(armPhase) * 7 * s : 0;
    c.fillStyle = shade(a.suit, -12);
    rr(c, -9 * s + swing * 0.4, 0, 8 * s, 30 * s, 3 * s); c.fill();
    rr(c, 1 * s - swing * 0.4, 0, 8 * s, 30 * s, 3 * s); c.fill();
    c.fillStyle = '#14100c';
    rr(c, -10 * s + swing * 0.4, 28 * s, 10 * s, 4.5 * s, 2 * s); c.fill();
    rr(c, 0 * s - swing * 0.4, 28 * s, 10 * s, 4.5 * s, 2 * s); c.fill();
  }
  /* jacket */
  c.fillStyle = a.suit;
  c.beginPath();
  c.moveTo(-w, -34 * s);
  c.bezierCurveTo(-w - 2 * s, -18 * s, -w + 3 * s, -6 * s, -w + 6 * s, 0);
  c.lineTo(w - 6 * s, 0);
  c.bezierCurveTo(w - 3 * s, -6 * s, w + 2 * s, -18 * s, w, -34 * s);
  c.closePath(); c.fill();
  /* shirt V */
  c.fillStyle = a.shirt;
  c.beginPath();
  c.moveTo(-8 * s, -34 * s);
  c.lineTo(0, -22 * s);
  c.lineTo(8 * s, -34 * s);
  c.closePath(); c.fill();
  /* lapels */
  c.strokeStyle = shade(a.suit, 26); c.lineWidth = 1.6 * s;
  c.beginPath();
  c.moveTo(-8 * s, -34 * s); c.lineTo(-2 * s, -20 * s); c.lineTo(-6 * s, -12 * s);
  c.moveTo(8 * s, -34 * s); c.lineTo(2 * s, -20 * s); c.lineTo(6 * s, -12 * s);
  c.stroke();
  /* tie */
  if (a.tie) {
    c.fillStyle = a.tie;
    c.beginPath();
    c.moveTo(-2.2 * s, -32 * s); c.lineTo(2.2 * s, -32 * s);
    c.lineTo(1.4 * s, -12 * s); c.lineTo(0, -9 * s); c.lineTo(-1.4 * s, -12 * s);
    c.closePath(); c.fill();
    c.fillStyle = shade(a.tie, -22);
    c.beginPath(); c.moveTo(-2.6 * s, -33.5 * s); c.lineTo(2.6 * s, -33.5 * s);
    c.lineTo(2 * s, -30.5 * s); c.lineTo(-2 * s, -30.5 * s); c.closePath(); c.fill();
  }
  /* arms */
  const armY = -32 * s;
  c.strokeStyle = shade(a.suit, -8); c.lineWidth = 6.5 * s; c.lineCap = 'round';
  if (pose === 'sit') {
    /* hands forward onto table */
    c.beginPath(); c.moveTo(-w + 2 * s, armY); c.quadraticCurveTo(-w - 6 * s, armY + 14 * s, -10 * s, 4 * s); c.stroke();
    c.beginPath(); c.moveTo(w - 2 * s, armY); c.quadraticCurveTo(w + 6 * s, armY + 14 * s, 10 * s, 4 * s); c.stroke();
    c.fillStyle = a.skin;
    c.beginPath(); c.arc(-10 * s, 4 * s, 3.2 * s, 0, 7); c.fill();
    c.beginPath(); c.arc(10 * s, 4 * s, 3.2 * s, 0, 7); c.fill();
  } else if (pose === 'point') {
    /* one arm raised in the Trump gesture */
    c.beginPath(); c.moveTo(-w + 2 * s, armY); c.lineTo(-w - 2 * s, armY + 16 * s); c.stroke();
    c.beginPath(); c.moveTo(w - 2 * s, armY); c.quadraticCurveTo(w + 8 * s, armY - 8 * s, w + 14 * s, armY - 18 * s); c.stroke();
    c.fillStyle = a.skin;
    c.beginPath(); c.arc(w + 14 * s, armY - 18 * s, 3.4 * s, 0, 7); c.fill();
  } else {
    const sw = pose === 'walk' ? Math.sin(armPhase) * 8 * s : 0;
    c.beginPath(); c.moveTo(-w + 2 * s, armY); c.lineTo(-w + 3 * s + sw * 0.5, -2 * s); c.stroke();
    c.beginPath(); c.moveTo(w - 2 * s, armY); c.lineTo(w - 3 * s - sw * 0.5, -2 * s); c.stroke();
    c.fillStyle = a.skin;
    c.beginPath(); c.arc(-w + 3 * s + sw * 0.5, -1 * s, 3 * s, 0, 7); c.fill();
    c.beginPath(); c.arc(w - 3 * s - sw * 0.5, -1 * s, 3 * s, 0, 7); c.fill();
  }
  /* accessories in hand */
  if (a.phone) {
    c.fillStyle = '#0c0e12';
    rr(c, 12 * s, -18 * s, 6 * s, 10 * s, 1.6 * s); c.fill();
    c.fillStyle = 'rgba(140,180,255,0.85)';
    rr(c, 12.8 * s, -17 * s, 4.4 * s, 7 * s, 1 * s); c.fill();
  }
  if (a.vial) {
    c.fillStyle = 'rgba(240,220,150,0.9)';
    rr(c, -17 * s, -10 * s, 4 * s, 9 * s, 2 * s); c.fill();
    c.fillStyle = '#b09a54';
    c.fillRect(-17 * s, -12 * s, 4 * s, 2.4 * s);
  }
  if (a.laptop) {
    c.fillStyle = '#3a4048';
    rr(c, 8 * s, -6 * s, 13 * s, 9 * s, 1.5 * s); c.fill();
    c.fillStyle = 'rgba(150,190,255,0.8)';
    rr(c, 9 * s, -5 * s, 11 * s, 6 * s, 1 * s); c.fill();
  }
  /* leather jacket collar (Jensen) */
  if (a.leather) {
    c.strokeStyle = '#0c0c0e'; c.lineWidth = 3 * s;
    c.beginPath(); c.moveTo(-w + 1 * s, -33 * s); c.lineTo(-4 * s, -20 * s);
    c.moveTo(w - 1 * s, -33 * s); c.lineTo(4 * s, -20 * s); c.stroke();
  }
  /* prayer beads (Jensen) */
  if (a.beads) {
    c.strokeStyle = '#c9a227'; c.lineWidth = 1.2 * s;
    c.beginPath(); c.arc(0, -30 * s, 7.5 * s, 0.5, 2.64); c.stroke();
  }
  c.restore();
}

/* ---- full figure ---- */
function drawFigure(c, id, x, y, s, opt) {
  opt = opt || {};
  const a = CHAR_ART[id] || CHAR_ART.player;
  const pose = opt.pose || 'stand';
  const phase = opt.phase || 0;
  const look = opt.look || 0;
  const blink = opt.blink || false;
  c.save();
  c.translate(x, y);
  if (opt.flip) c.scale(-1, 1);
  /* gold rim-light shadow */
  c.fillStyle = 'rgba(0,0,0,0.28)';
  c.beginPath(); c.ellipse(0, 1.5 * s, 14 * s, 3.4 * s, 0, 0, 7); c.fill();
  drawTorso(c, a, s, phase, pose);
  drawHead(c, a, s, blink, look);
  c.restore();
}

/* ---- faceTime window (Sam) ---- */
function drawFaceTime(c, x, y, w, h, t) {
  c.save();
  rr(c, x, y, w, h, 6); c.clip();
  c.fillStyle = '#121826'; c.fillRect(x, y, w, h);
  const s = w / 90;
  drawFigure(c, 'sam', x + w * 0.5, y + h * 0.96, s * 1.15, { pose: 'stand', look: Math.sin(t * 0.9) });
  /* goblin merch bouncing */
  const gy = y + h - 26 * s * 1.15 - Math.abs(Math.sin(t * 3)) * 8;
  c.fillStyle = '#3f7d4e';
  c.beginPath(); c.arc(x + w * 0.18, gy, 9, 0, 7); c.fill();
  c.fillStyle = '#fff'; c.font = 'bold 10px Georgia'; c.textAlign = 'center';
  c.fillText('DOTS', x + w * 0.18, gy + 4);
  c.fillStyle = '#0c0e12'; rr(c, x + w * 0.62, y + 8, 26, 14, 3); c.fill();
  c.fillStyle = '#e8c96a'; c.font = 'bold 9px monospace';
  c.fillText('LIVE', x + w * 0.62 + 13, y + 18);
  c.restore();
  c.strokeStyle = '#3a4f7a'; c.lineWidth = 2;
  rr(c, x, y, w, h, 6); c.stroke();
}

/* ==================== mini.js ==================== */
/* ==================== mini.js — six micro-games (no falling orbs) ==================== */

let mini = null;   // { id, t, elapsed, done, success, residue, toast, title, how, time }

function startMini(id) {
  const def = MINI[id];
  mini = { id: id, t: 0, elapsed: 0, done: false, success: false, residue: null, toast: '', title: def.title, how: def.how, time: def.time };
  def.init();
}
function finishMini(success, residue, toast) {
  mini.success = success; mini.residue = residue || {}; mini.toast = toast || ''; mini.done = true;
}

/* ---- shared chrome ---- */
function drawMiniShell(c, W, H, t) {
  c.fillStyle = 'rgba(7,10,18,0.72)'; c.fillRect(0, 0, W, H);
  const pw = Math.min(760, W * 0.72), ph = Math.min(430, H * 0.72);
  const px = (W - pw) / 2, py = (H - ph) / 2;
  c.fillStyle = PAL.cream; rr(c, px, py, pw, ph, 10); c.fill();
  c.strokeStyle = PAL.gold; c.lineWidth = 2.5; rr(c, px, py, pw, ph, 10); c.stroke();
  c.fillStyle = PAL.ink; c.font = 'bold 21px Georgia, serif'; c.textAlign = 'left';
  c.fillText(mini.title, px + 24, py + 38);
  c.fillStyle = '#5a4a38'; c.font = '14px Georgia, serif';
  c.fillText(mini.how, px + 24, py + 60);
  /* time bar */
  const frac = 1 - Math.min(1, mini.elapsed / mini.time);
  c.fillStyle = '#d9cfae'; rr(c, px + 24, py + ph - 26, pw - 48, 10, 5); c.fill();
  c.fillStyle = frac > 0.3 ? PAL.green : PAL.red; rr(c, px + 24, py + ph - 26, (pw - 48) * frac, 10, 5); c.fill();
  return { px: px, py: py, pw: pw, ph: ph };
}

const MINI = {
  /* ---- ELON: phone composer ---- */
  phone: {
    title: 'ELON’S PHONE — post the thing',
    how: 'Click a draft, then POST. One of these is a bad idea.',
    time: 16,
    init() { mini.drafts = ['Banger.', 'Grading each other’s homework. Morally.', 'Dots are here. Wait—'], mini.picked = -1, mini.likes = 0, mini.posted = false; },
    tick(dt) {
      mini.t += dt;
      if (mini.posted) { mini.elapsed += dt * 0.2; return; }
      mini.elapsed += dt;
      if (mini.elapsed > mini.time) { finishMini(false, { meme:+1, drama:+1 }, 'The phone slept. PR is monitoring the situation.'); return; }
      for (let i = 0; i < 3; i++) {
        const r = miniRects['draft' + i];
        if (r && hitTest(r) && CLICKS.length) { CLICKS.pop(); mini.picked = i; break; }
      }
      if (mini.picked >= 0) {
        const r = miniRects['post'];
        if (r && hitTest(r) && CLICKS.length) {
          CLICKS.pop(); mini.posted = true;
          const bad = mini.picked === 2;
          if (bad) finishMini(false, { meme:+1, drama:+1 }, '“Dots are here.” That was Sam’s line. PR is monitoring the situation.');
          else finishMini(true, { meme:+2, optics:+1 }, 'Posted. The internet finds it before dessert.');
        }
      }
    },
    draw(c, t) {
      const b = drawMiniShell(c, W, H, t);
      /* phone */
      const cx = b.px + 120, cy = b.py + 90;
      c.fillStyle = '#0c0e12'; rr(c, cx, cy, 150, 250, 18); c.fill();
      c.fillStyle = '#eef0f4'; rr(c, cx + 8, cy + 8, 134, 234, 12); c.fill();
      c.fillStyle = '#8899aa'; c.font = '9px monospace'; c.textAlign = 'left';
      c.fillText('X · POST', cx + 16, cy + 24);
      for (let i = 0; i < 3; i++) {
        const dy = cy + 38 + i * 62;
        const r = { x: cx + 14, y: dy, w: 122, h: 54 };
        miniRects['draft' + i] = r;
        c.fillStyle = mini.picked === i ? '#d8e4f4' : '#fff';
        rr(c, r.x, r.y, r.w, r.h, 6); c.fill();
        c.strokeStyle = mini.picked === i ? '#3a6ea5' : '#c8c8c8'; c.lineWidth = 1.5; rr(c, r.x, r.y, r.w, r.h, 6); c.stroke();
        c.fillStyle = '#22262c'; c.font = 'italic 10.5px Georgia';
        wrapText(c, mini.drafts[i], r.x + 8, r.y + 16, r.w - 16, 13);
      }
      const pr = { x: cx + 14, y: cy + 226, w: 122, h: 16 };
      miniRects['post'] = pr;
      c.fillStyle = mini.picked >= 0 ? '#1d9bf0' : '#9aa4b0';
      rr(c, pr.x, pr.y, pr.w, pr.h, 8); c.fill();
      c.fillStyle = '#fff'; c.font = 'bold 10px monospace'; c.textAlign = 'center';
      c.fillText(mini.picked >= 0 ? 'POST' : 'PICK A DRAFT', pr.x + pr.w / 2, pr.y + 11);
      /* Elon watching */
      drawFigure(c, 'musk', b.px + b.pw - 120, b.py + b.ph - 40, 1.35, { pose: 'stand', look: Math.sin(t * 1.4) });
      c.fillStyle = '#5a4a38'; c.font = 'italic 13px Georgia, serif'; c.textAlign = 'center';
      c.fillText(mini.posted ? '“Historic.”' : '“Probably.”', b.px + b.pw - 120, b.py + b.ph - 66);
    }
  },

  /* ---- JENSEN: sand conveyor ---- */
  sand: {
    title: 'SAND → WAFER → GPU',
    how: 'Drag the sand along the track. Hold it inside each station until it converts.',
    time: 20,
    init() { mini.sx = 0.06; mini.station = 0; mini.hold = 0; mini.stage = ['SAND', 'WAFER', 'GPU']; },
    tick(dt) {
      mini.t += dt; mini.elapsed += dt;
      if (mini.elapsed > mini.time) { finishMini(false, { optics:-1 }, 'The sand stayed sand. Jensen nods anyway.'); return; }
      if (MDOWN && MXY) {
        const track = miniRects['track'];
        if (track && MXY.x > track.x && MXY.x < track.x + track.w) {
          mini.sx = (MXY.x - track.x) / track.w;
        }
      }
      const zone = Math.min(2, Math.floor(mini.sx * 3));
      const inZone = Math.abs(mini.sx - (zone + 0.5) / 3) < 0.16;
      if (zone === mini.station && inZone && MDOWN) {
        mini.hold += dt;
        if (mini.hold > 1.6) { mini.hold = 0; mini.station++; if (mini.station > 2) { finishMini(true, { optics:+1, substance:+1 }, 'Sand to GPU. The vial glints. The jacket does the rest.'); } }
      } else { mini.hold = Math.max(0, mini.hold - dt * 0.6); }
    },
    draw(c, t) {
      const b = drawMiniShell(c, W, H, t);

/* ---- shared East Room background ---- */
function drawEastRoomBg(c, t, variant) {
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b1220'); g.addColorStop(0.55, '#16233c'); g.addColorStop(1, '#1d2f4d');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  /* wainscoting */
  c.fillStyle = '#141d30'; c.fillRect(0, 330, W, H - 330);
  c.fillStyle = '#1a2740'; c.fillRect(0, 330, W, 8);
  for (let x = 10; x < W; x += 64) { c.fillStyle = 'rgba(232,201,106,0.06)'; c.fillRect(x, 346, 2, 120); }
  /* chandelier with bloom */
  const chx = W / 2, chy = 74 + Math.sin(t * 0.6) * 3;
  const bloom = c.createRadialGradient(chx, chy, 4, chx, chy, 150);
  bloom.addColorStop(0, 'rgba(244,227,161,0.5)'); bloom.addColorStop(1, 'rgba(244,227,161,0)');
  c.fillStyle = bloom; c.fillRect(chx - 160, chy - 100, 320, 260);
  c.strokeStyle = '#c9a227'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(chx, 0); c.lineTo(chx, chy - 34); c.stroke();
  c.beginPath(); c.ellipse(chx, chy, 52, 15, 0, 0, 7); c.stroke();
  c.beginPath(); c.ellipse(chx, chy - 16, 30, 10, 0, 0, 7); c.stroke();
  for (let i = -2; i <= 2; i++) {
    c.fillStyle = '#f4e3a1';
    c.beginPath(); c.arc(chx + i * 22, chy + 2 + Math.abs(i) * 5, 3.4, 0, 7); c.fill();
  }
  /* gold curtains, drifting */
  for (const side of [0, 1]) {
    const cx = side ? W - 130 : 0;
    const drift = Math.sin(t * 0.4 + side * 2) * 4;
    c.fillStyle = '#7a1f1f';
    c.beginPath();
    c.moveTo(cx + drift, 0);
    c.bezierCurveTo(cx + 90 + drift, H * 0.3, cx + 30 + drift, H * 0.7, cx + 70 + drift, H);
    c.lineTo(cx + (side ? 130 : -20) + drift, H);
    c.bezierCurveTo(cx + (side ? 60 : 60) + drift, H * 0.6, cx + (side ? 110 : 20) + drift, H * 0.25, cx + (side ? 130 : -20), 0);
    c.closePath(); c.fill();
    c.fillStyle = 'rgba(201,162,39,0.22)';
    for (let i = 0; i < 4; i++) c.fillRect(cx + 12 + i * 22 + drift, 0, 5, H);
  }
  /* tall windows with protest dots outside */
  for (const wx of [170, W - 300]) {
    c.fillStyle = '#0e1830';
    rr(c, wx, 96, 130, 220, 4); c.fill();
    c.strokeStyle = '#c9a227'; c.lineWidth = 3; rr(c, wx, 96, 130, 220, 4); c.stroke();
    c.beginPath(); c.moveTo(wx + 65, 96); c.lineTo(wx + 65, 316); c.moveTo(wx, 206); c.lineTo(wx + 130, 206); c.stroke();
    /* night outside */
    c.fillStyle = 'rgba(232,201,106,0.05)';
    c.beginPath(); c.arc(wx + 30, 140, 16, 0, 7); c.fill();
    /* protest dots bobbing */
    c.fillStyle = '#e8c96a';
    for (let i = 0; i < 7; i++) {
      const px2 = wx + 18 + i * 16, py2 = 268 + Math.sin(t * 2 + i * 1.7) * 4;
      c.beginPath(); c.arc(px2, py2, 2.6, 0, 7); c.fill();
    }
  }
}

/* ---- THE ROOM (playable) ---- */
function drawRoom(c, t, dt) {
  /* camera eases toward the player */
  const target = G.playerX * W - W / 2;
  cam += (target - cam) * Math.min(1, dt * 3);
  cam = Math.max(-W * 0.18, Math.min(W * 0.18, cam));
  c.save();
  c.translate(-cam * 0.5, 0);
  drawEastRoomBg(c, t, 'room');
  c.restore();
  c.save();
  c.translate(-cam, 0);
  drawTable(c, t);
  /* ambient walkers: Sacks, Karp, Johnson, Vance, Bezos, Lisa passing + Tom Brown at the far end */
  const walkers = [
    { id:'sacks', x: 40,  y: 640 },
    { id:'karp',  x: 130, y: 648 },
    { id:'vance', x: 1180, y: 644 },
    { id:'bezos', x: 1230, y: 640 },
    { id:'johnson', x: 1120, y: 646 },
    { id:'lisa',  x: 640 + Math.sin(t * 0.22) * 420, y: 636 },
    { id:'tombrown', x: 1262, y: 644, talk: true }
  ];
  for (const wd of walkers) {
    drawFigure(c, wd.id, wd.x, wd.y, 1.15, { pose: 'stand', look: Math.sin(t * 0.7 + wd.x) });
    if (wd.talk) {
      HOTRECTS.push({ x: wd.x - 30, y: wd.y - 130, w: 60, h: 140, id: 'npc_tombrown' });
      const near = Math.abs(G.playerX * W - wd.x) < 80;
      if (near && G.screen === 'room' && !G.tomDone) {
        c.fillStyle = 'rgba(245,239,221,0.92)';
        rr(c, wd.x - 44, wd.y - 158, 88, 22, 11); c.fill();
        c.fillStyle = '#101b2d'; c.font = 'bold 10px Georgia'; c.textAlign = 'center';
        c.fillText('TALK', wd.x, wd.y - 143);
      }
    }
  }
  /* seated signers */
  for (const s of SEATS) {
    if (s.id === G.playerId) continue;
    const px2 = 60 + s.x * (W - 140);
    const isTrump = s.id === 'trump';
    const talked = G.talksDone.indexOf(s.id) !== -1;
    drawFigure(c, s.id, px2, 500, 1.6, {
      pose: isTrump ? 'point' : 'sit',
      look: Math.max(-1, Math.min(1, (G.playerX * W - px2) / 200)),
      blink: Math.sin(t * 0.9 + s.x * 9) > 0.985
    });
    /* talked badge */
    if (talked && !isTrump) {
      c.fillStyle = PAL.green;
      c.beginPath(); c.arc(px2 + 24, 420, 7, 0, 7); c.fill();
      c.fillStyle = '#fff'; c.font = 'bold 9px Georgia'; c.textAlign = 'center';
      c.fillText('✓', px2 + 24, 423);
    }
    /* interaction hit rect: includes the TALK bubble above the head + proximity hint */
    const r = { x: px2 - 34, y: 262, w: 68, h: 258 };
    HOTRECTS.push({ x: r.x, y: r.y, w: r.w, h: r.h, id: 'npc_' + s.id, npc: s.id });
    const near = Math.abs(G.playerX * W - px2) < 80;
    if (near && G.screen === 'room') {
      c.fillStyle = 'rgba(245,239,221,0.92)';
      rr(c, px2 - 44, 276, 88, 22, 11); c.fill();
      c.fillStyle = '#101b2d'; c.font = 'bold 10px Georgia'; c.textAlign = 'center';
      c.fillText(isTrump ? (G.talksDone.length >= 3 ? 'THE DESK' : 'AT THE SIGNING') : (talked ? 'AGAIN' : (G.talksDone.length >= 3 ? 'PEN IS UP' : 'TALK')), px2, 291);
    }
  }
  /* press cameras in the dark */
  for (let i = 0; i < 3; i++) {
    const cx2 = 200 + i * 380 + Math.sin(t * 0.3 + i * 2) * 14;
    c.fillStyle = '#0a0c12';
    rr(c, cx2, 588, 54, 30, 4); c.fill();
    rr(c, cx2 + 16, 574, 22, 16, 3); c.fill();
    c.fillStyle = '#1a2030';
    c.beginPath(); c.arc(cx2 + 27, 582, 6, 0, 7); c.fill();
    /* flash bursts */
    const fl = Math.sin(t * 1.7 + i * 2.4);
    if (fl > 0.93) {
      const fg = c.createRadialGradient(cx2 + 27, 582, 2, cx2 + 27, 582, 60);
      fg.addColorStop(0, 'rgba(255,255,255,0.75)'); fg.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = fg; c.fillRect(cx2 - 40, 530, 140, 120);
    }
  }
  /* the player */
  const pxx = G.playerX * W;
  const walking = Math.abs(G.vx) > 4;
  G.walkPhase = walking ? G.walkPhase + Math.abs(G.vx) * 0.045 : 0;
  drawFigure(c, 'player', pxx, 662, 1.5, {
    pose: walking ? 'walk' : 'stand',
    phase: G.walkPhase,
    flip: G.vx < -4,
    look: Math.sin(t * 0.8) * 0.5,
    blink: Math.sin(t * 1.1) > 0.99
  });
  c.restore();
  drawHUD(c);
}

/* ---- dialogue (talk) ---- */
function drawTalk(c, t, dt) {
  drawRoom(c, t, dt);

  c.fillStyle = 'rgba(7,10,18,0.45)'; c.fillRect(0, 0, W, H);
  const tk = G.talk;
  const who = CAST.find(k => k.id === tk.id);
  const panelW = 560, panelH = 190, px2 = 60, py2 = H - panelH - 30;
  c.fillStyle = PAL.cream; rr(c, px2, py2, panelW, panelH, 10); c.fill();
  c.strokeStyle = PAL.gold; c.lineWidth = 2.5; rr(c, px2, py2, panelW, panelH, 10); c.stroke();
  /* speaker */
  c.fillStyle = PAL.ink; c.font = 'bold 16px Georgia, serif'; c.textAlign = 'left';
  c.fillText(who.name.toUpperCase() + ' — ' + who.co, px2 + 22, py2 + 34);
  /* lines so far, current line typed */
  c.font = 'italic 14.5px Georgia, serif';
  const shown = tk.lines.slice(0, tk.lineIdx + 1);
  const cur = shown[shown.length - 1] || '';
  const typed = cur.slice(0, Math.floor(tk.typeT * 34));
  let yy = py2 + 62;
  shown.slice(0, -1).forEach(l => { c.fillStyle = 'rgba(16,20,28,0.45)'; wrapText(c, l, px2 + 22, yy, panelW - 44); yy += 19 * wrapCount(c, l, panelW - 44); });
  c.fillStyle = PAL.ink;
  wrapText(c, typed + (Math.sin(t * 6) > 0 ? '|' : ''), px2 + 22, yy, panelW - 44, 17);
  /* choices or advance */
  const allShown = tk.lineIdx >= tk.lines.length - 1 && tk.typeT * 34 >= cur.length;
  if (!allShown) {
    c.fillStyle = 'rgba(16,20,28,0.5)'; c.font = '11px Georgia, serif';
    c.fillText('click to continue', px2 + panelW - 130, py2 + panelH - 14);
  }
  if (tk.phase === 'replies') {
    tk.replies.forEach((rep, i) => {
      const bw2 = (panelW - 56) / 2, bx2 = px2 + 22 + i * (bw2 + 12), by2 = py2 + panelH - 62;
      const hot2 = MX > bx2 && MX < bx2 + bw2 && MY > by2 && MY < by2 + 44;
      c.fillStyle = hot2 ? '#16233c' : '#1d2f4d';
      rr(c, bx2, by2, bw2, 44, 8); c.fill();
      c.strokeStyle = hot2 ? PAL.gold : '#3a4a68'; c.lineWidth = hot2 ? 2.5 : 1.5;
      rr(c, bx2, by2, bw2, 44, 8); c.stroke();
      c.fillStyle = PAL.cream; c.font = '12.5px Georgia, serif'; c.textAlign = 'center';
      wrapText(c, rep.t, bx2 + 10, by2 + 19, bw2 - 20, 14);
      HOTRECTS.push({ x: bx2, y: by2, w: bw2, h: 44, id: 'reply_' + i });
    });
  }
}

  const ids = ['musk', 'huang', 'zuck', 'pichai', 'amodei', 'brockman'];

const canvas = document.getElementById('stage');

function resize() {
  const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);

  canvas.width = Math.round(1280 * scale * DPR);

  ctx.setTransform(scale * DPR, 0, 0, scale * DPR, 0, 0);

}

function hitTest(r) {

/* ---- text helpers ---- */
function wrapCount(c, text, maxW) {
  const words = String(text).split(' ');
  let lines = 1, cur = '';
  for (const wd of words) {
    const test = cur ? cur + ' ' + wd : wd;
    if (c.measureText(test).width > maxW && cur) { lines++; cur = wd; } else { cur = test; }
  }
  return lines;
}
function wrapText(c, text, x, y, maxW) {
  const words = String(text).split(' ');
  let cur = '', yy = y;
  for (const wd of words) {
    const test = cur ? cur + ' ' + wd : wd;
    if (c.measureText(test).width > maxW && cur) { c.fillText(cur, x, yy); yy += 18; cur = wd; } else { cur = test; }
  }
  if (cur) c.fillText(cur, x, yy);
  return yy;
}
function wrapTextLines(c, text, maxW) {
  const words = String(text).split(' ');
  const lines = []; let cur = '';
  for (const wd of words) {
    const test = cur ? cur + ' ' + wd : wd;
    if (c.measureText(test).width > maxW && cur) { lines.push(cur); cur = wd; } else { cur = test; }
  }
  if (cur) lines.push(cur);
  return lines;
}

/* ---- toast: one at a time, dies ---- */
function toast(t) { G.toast = { t: t, born: G.t }; }

/* ---- audio: tasteful and quiet ---- */
let AC = null, muted = false;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  return AC;
}
function tone(f, dur, type, gain, delay) {
  const a = ac(); if (!a || muted) return;
  try {
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.value = f; g.gain.value = gain || 0.06;
    o.connect(g); g.connect(a.destination);
    const t0 = a.currentTime + (delay || 0);
    o.start(t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.stop(t0 + dur);
  } catch (e) {}
}
function noiseBurst(dur, gain, delay) {
  const a = ac(); if (!a || muted) return;
  try {
    const len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = a.createBufferSource(); src.buffer = buf;
    const g = a.createGain(); g.gain.value = gain || 0.08;
    src.connect(g); g.connect(a.destination);
    src.start(a.currentTime + (delay || 0));
  } catch (e) {}
}
function sfx(name) {
  if (muted) return;
  if (name === 'ui') tone(520, 0.06, 'sine', 0.04);
  else if (name === 'talk') tone(340, 0.05, 'sine', 0.035);
  else if (name === 'good') { tone(523, 0.09, 'sine', 0.05); tone(659, 0.12, 'sine', 0.045, 0.07); }
  else if (name === 'bad') tone(180, 0.16, 'sawtooth', 0.05);
  else if (name === 'shutter') noiseBurst(0.07, 0.1);
  else if (name === 'pen') noiseBurst(0.2, 0.03);
  else if (name === 'stamp') tone(140, 0.08, 'square', 0.06);
  else if (name === 'sign') { tone(392, 0.15, 'sine', 0.05); tone(494, 0.2, 'sine', 0.045, 0.1); }
}
function toggleMute() { muted = !muted; }

/* ---- run setup: ACT I is where your body is at the table ---- */
function resetRun(playerId) {
  G.playerId = playerId;
  G.talksDone = [];
  G.tomDone = false;
  G.flags = {}; stateFlags = G.flags;
  G.ledger = { rapport: 50, optics: 0, substance: 0, drama: 0, meme: 0, typoAlive: true, sam: false, mic: 'trump' };
  G.invitedMic = null;

  G.endingId = null;
  G.talk = null;
  G.signLine = 0; G.signPhase = 'lines';
  G.gaggleT = 0; G.roomT = 0;
  G.paused = false;
  cam = 0;
  const st = STARTS[playerId];
  if (st) {
    G.playerX = st.x;
    for (const k in st.ledger) G.ledger[k] += st.ledger[k];
    toast(st.toast);
  }
}

function startGame(id) {
  resetRun(id);
  G.screen = 'room';
  sfx('sign');
}

/* ---- talk flow ---- */
function openTalk(id) {
  const tk = TALKS[id];
  if (!tk) return;
  const lines = tk.lines.slice();
  const ref = tk.ref ? tk.ref(G.flags) : null;
  if (ref && G.talksDone.indexOf(id) !== -1) lines.unshift(ref);
  G.talk = { id: id, lines: lines, lineIdx: 0, typeT: 0, phase: 'lines', replies: tk.replies, mini: tk.mini };
  G.screen = 'talk';
  sfx('talk');
}
function advanceTalk() {
  const tk = G.talk;
  if (!tk) return;
  const cur = tk.lines[tk.lineIdx] || '';
  if (tk.typeT * 34 < cur.length) { tk.typeT = cur.length / 34 + 0.01; return; }
  if (tk.lineIdx < tk.lines.length - 1) { tk.lineIdx++; tk.typeT = 0; sfx('talk'); }
}
function chooseReply(i) {
  const tk = G.talk;
  const rep = tk.replies[i];
  /* A second conversation is a callback, not a second helping: no effects, no micro-game. */
  if (G.talksDone.indexOf(tk.id) !== -1 || (tk.id === 'tombrown' && G.tomDone)) {
    if (rep.toast) toast(rep.toast);
    sfx('ui');
    endTalk();
    return;
  }
  G.ledger.rapport = Math.max(0, Math.min(100, G.ledger.rapport + (rep.r || 0)));
  if (rep.r >= 6) G.flags.flattered = true;
  if (rep.residue) for (const k in rep.residue) G.ledger[k] += rep.residue[k];
  if (rep.flag) G.flags[rep.flag] = true;
  if (rep.toast) toast(rep.toast);
  if (rep.r >= 0) sfx('good'); else sfx('bad');
  if (tk.mini) { G.screen = 'mini'; startMini(tk.mini); }
  else endTalk();
}
function endTalk() {
  const tk = G.talk;
  const id = tk.id;
  G.talk = null;
  if (id === 'tombrown') G.tomDone = true;
  if (id !== 'tombrown' && G.talksDone.indexOf(id) === -1) {
    G.talksDone.push(id);
    if (G.talksDone.length === 3) {
      G.endingId = computeEndingId(G);   /* provisional ending after Act II */
      toast('The pen is up. Walk to the President’s desk.');
      sfx('sign');
    }
  }
  G.screen = 'room';
}

/* ---- update ---- */
function update(dt) {
  if (G.paused) return;

    const left = keys['arrowleft'] || keys['a'], right = keys['arrowright'] || keys['d'];
    G.vx = (right ? 160 : 0) - (left ? 160 : 0);
    G.playerX = Math.max(0.04, Math.min(0.96, G.playerX + G.vx * dt / W));
    /* ambient jokes: one at a time */
    if (!G.toast || G.t - G.toast.born > 5) {
      for (const trg of AMBIENT_TRIGGERS) {
        if (!ambientDone[trg.id] && trg.when()) {
          ambientDone[trg.id] = true;
          toast(AMBIENT[trg.id]);
          break;
        }
      }
    }
  } else if (G.screen === 'talk') {
    if (G.talk) G.talk.typeT += dt;
  } else if (G.screen === 'mini') {
    if (mini && !mini.done) MINI[mini.id].tick(dt);
    else if (mini && mini.done) {
      for (const k in mini.residue) G.ledger[k] += mini.residue[k];
      if (mini.residue && mini.residue.flag) G.flags[mini.residue.flag] = true;
      if (mini.toast) toast(mini.toast);
      sfx(mini.success ? 'good' : 'bad');
      endTalk();
    }
  } else if (G.screen === 'gaggle') {
    G.gaggleT += dt;
    const beats = gaggleBeats(G.flags, G.ledger);
    if (G.gaggleT > beats.length * 5.5 + 1) {
      G.endingId = computeEndingId(G);
      G.screen = 'end';
      sfx('sign');
    }
  }
}

/* ---- draw ---- */
function draw() {
  HOTRECTS.length = 0;
  ctx.clearRect(0, 0, W, H);
  switch (G.screen) {
    case 'title': drawTitle(ctx, G.t); break;
    case 'cast': drawCast(ctx, G.t); break;
    case 'how': drawHow(ctx, G.t); break;
    case 'room': drawRoom(ctx, G.t, lastDt); break;
    case 'talk': drawTalk(ctx, G.t, lastDt); break;
    case 'mini':
      if (mini) { MINI[mini.id].draw(ctx, G.t); }
      break;
    case 'sign': drawSign(ctx, G.t, lastDt); break;
    case 'gaggle': drawGaggle(ctx, G.t, lastDt); break;
    case 'end': drawEnd(ctx, G.t); break;
  }
  if (G.paused && (G.screen === 'room' || G.screen === 'talk')) drawPause(ctx, G.t);
  /* mute toggle in the corner */
  const mb = { x: W - 34, y: H - 30, w: 24, h: 22 };
  HOTRECTS.push({ x: mb.x, y: mb.y, w: mb.w, h: mb.h, id: 'mute' });
  ctx.fillStyle = 'rgba(7,10,18,0.6)'; rr(ctx, mb.x, mb.y, mb.w, mb.h, 5); ctx.fill();
  ctx.strokeStyle = 'rgba(232,201,106,0.5)'; ctx.lineWidth = 1; rr(ctx, mb.x, mb.y, mb.w, mb.h, 5); ctx.stroke();
  ctx.fillStyle = muted ? 'rgba(245,239,221,0.4)' : 'rgba(232,201,106,0.9)';
  ctx.font = 'bold 11px Georgia, serif'; ctx.textAlign = 'center';
  ctx.fillText(muted ? '×' : '♪', mb.x + 12, mb.y + 15);
}

/* ---- click handling (immediate mode, after draw registers rects) ---- */
function handleClicks() {
  if (G.screen === 'title') {
    if (clicked('PLAY')) { G.screen = 'cast'; sfx('ui'); }
    if (clicked('CAST')) { G.screen = 'cast'; sfx('ui'); }
    if (clicked('HOW')) { G.screen = 'how'; sfx('ui'); }
  } else if (G.screen === 'cast') {
    for (const k of CAST) {
      if (k.starter && clicked('pick_' + k.id)) { startGame(k.id); return; }
      if (k.locked && UNLOCKED.trump && clicked('pick_' + k.id)) { startGame(k.id); return; }
    }
    if (clicked('back_title')) { G.screen = 'title'; sfx('ui'); }
  } else if (G.screen === 'how') {
    if (clicked('back_title')) { G.screen = 'title'; sfx('ui'); }
  } else if (G.screen === 'room') {
    for (const s of SEATS) {
      if (s.id === G.playerId) continue;
      if (clicked('npc_' + s.id)) {
        if (s.id === 'trump') {
          if (G.talksDone.length >= 3) startSign();
          else toast('The pen comes at the signing. Mingle first.');
        } else if (G.talksDone.length >= 3 && G.talksDone.indexOf(s.id) === -1) {
          toast('Three conversations is the rule. The pen is up.');
        } else openTalk(s.id);
        return;
      }
    }
    if (clicked('npc_tombrown')) { openTalk('tombrown'); return; }
  } else if (G.screen === 'talk') {
    const tk = G.talk;
    if (!tk) return;
    const cur = tk.lines[tk.lineIdx] || '';
    const allShown = tk.lineIdx >= tk.lines.length - 1 && tk.typeT * 34 >= cur.length;
    if (tk.phase === 'lines' && allShown) tk.phase = 'replies';
    if (tk.phase === 'replies') {
      for (let i = 0; i < tk.replies.length; i++) {
        if (clicked('reply_' + i)) { chooseReply(i); return; }
      }
    } else {
      advanceTalk();
    }
  } else if (G.screen === 'sign') {
    if (G.signPhase === 'lines') {
      if (G.signLine < SIGN_LINES.length - 1) { G.signLine++; sfx('talk'); }
      else G.signPhase = 'choices';
    } else if (G.signPhase === 'choices') {
      for (const ch of SIGN_CHOICES) {
        if (clicked('sign_' + ch.id)) { chooseSign(ch.id); return; }
      }
    } else if (G.signPhase === 'mic') {
      const talked = G.talksDone.slice(0, 3);
      for (let i = 0; i < talked.length; i++) {
        if (clicked('mic_' + talked[i])) { pickMic(talked[i]); return; }
      }
      if (clicked('mic_nobody')) { pickMic('nobody'); return; }
    }
  } else if (G.screen === 'end') {
    if (clicked('again')) { UNLOCKED.trump = true; saveUnlocks(); startGame(G.playerId); return; }
    if (clicked('another')) { UNLOCKED.trump = true; saveUnlocks(); G.screen = 'cast'; return; }
  }
  if (clicked('mute')) toggleMute();
}
function saveUnlocks() {
  try { localStorage.setItem('wh_unlocks', JSON.stringify(UNLOCKED)); } catch (e) {}
}

/* ---- keyboard ---- */
window.addEventListener('keydown', function (e) {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (G.screen === 'room' && ['arrowleft', 'arrowright', 'arrowup', 'arrowdown', ' '].indexOf(k) >= 0) e.preventDefault();
  if (k === 'p') {
    if (G.screen === 'room' || G.screen === 'talk') G.paused = !G.paused;
  }
  if (k === 'm') toggleMute();
  if (k === 'escape' && G.screen === 'talk') { G.talk = null; G.screen = 'room'; }
});
window.addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });

/* ---- pointer ---- */
canvas.addEventListener('pointermove', function (e) {
  const r = canvas.getBoundingClientRect();
  MX = (e.clientX - r.left) / r.width * W;
  MY = (e.clientY - r.top) / r.height * H;
  MXY = { x: MX, y: MY };
});
canvas.addEventListener('pointerdown', function (e) {
  MDOWN = true;
  const r = canvas.getBoundingClientRect();
  CLICKS.push({ x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H });
});
window.addEventListener('pointerup', function () { MDOWN = false; });

/* ---- loop ---- */
let lastTs = 0, lastDt = 0.016;
function loop(ts) {
  const dt = Math.min(0.05, lastTs ? (ts - lastTs) / 1000 : 0.016);
  lastTs = ts;
  lastDt = dt;
  update(dt);
  draw();
  handleClicks();
  CLICKS.length = 0;
  requestAnimationFrame(loop);
}

/* ---- test hooks (deterministic QA, per threejs-game-skills discipline) ---- */
window.__GAME_TEST_HOOKS__ = {
  reset(seed) { RND = mulberry32(seed || 20260929); ambientDone = {}; },
  state: () => G,
  ledger: () => G.ledger,
  flags: () => G.flags,
  goto(screen) { G.screen = screen; },
  startGame, openTalk, chooseReply, startSign, chooseSign, pickMic,
  endMiniForce(success, residue, msg) { if (mini) finishMini(success, residue || {}, msg || ''); },
  mini: () => mini,
  advanceTalk,
  tick(dt) { update(dt || 0.016); draw(); handleClicks(); CLICKS.length = 0; },
  tickLight(dt) { update(dt || 0.016); handleClicks(); CLICKS.length = 0; },
  drawFrame() { draw(); },
  click(x, y) { CLICKS.push({ x: x, y: y }); },
  rects: () => HOTRECTS
};

/* ---- boot ---- */
resize();
window.addEventListener('resize', resize);
requestAnimationFrame(loop);

/* ==================== agent.js ==================== */
/* ==================== agent.js — the game's agent interface ====================
   Lets any controller — a scripted bot, a model-driven agent, a test — play a run through the SAME
   functions the UI uses. Nothing here bypasses the rules: act() calls startGame / openTalk /
   chooseReply / chooseSign / pickMic and lets update() settle the state, exactly like a click would.

   window.__AGENT_API__ = { observe(), legalActions(), act(action), MINI_OUTCOMES }

   Information rule: observe() never returns the hidden ledger. Each option does carry the effects it
   declares in the game data; how well a controller *uses* that information is its own skill. */

/* What a micro-game awards. Kept beside the game so a controller can resolve a micro-game without
   playing it. test/agents.test.js checks every literal below still appears in mini.js. */
const MINI_OUTCOMES = {
  phone:   { ok: { residue: { meme: +2, optics: +1 },     flags: [] },
             fail: { residue: { meme: +1, drama: +1 },    flags: [] } },
  sand:    { ok: { residue: { optics: +1, substance: +1 }, flags: [] },
             fail: { residue: { optics: -1 },             flags: [] } },
  caption: { ok: { residue: { optics: +1 },               flags: [] },
             fail: { residue: { drama: +1 },              flags: ['zuckCaption'] } },
  stamp:   { ok: { residue: { substance: +2, optics: +1 }, flags: [] },
             fail: { residue: { optics: -1 },             flags: [] } },
  slider:  { ok: { residue: { substance: +3, rapport: -2 }, flags: [] },
             fail: { residue: { substance: +1 },          flags: [] } },
  pen:     { ok: { residue: { optics: +1, drama: -1 },    flags: [] },
             fail: { residue: { drama: +1 },              flags: [] } }
};

function agentTalkTargets() {
  return Object.keys(TALKS).filter(function (id) {
    if (id === G.playerId) return false;
    if (id === 'tombrown') return !G.tomDone;
    return G.talksDone.length < 3 && G.talksDone.indexOf(id) === -1;   /* three conversations is the rule */
  });
}

function agentLegalActions() {
  const s = G.screen;
  if (s === 'title' || s === 'how' || s === 'cast') {
    return CAST.filter(function (k) { return k.starter || (k.locked && UNLOCKED.trump); })
      .map(function (k) { return { type: 'pick-seat', id: k.id, label: k.name }; });
  }
  if (s === 'room') {
    const out = agentTalkTargets().map(function (id) {
      return { type: 'talk', id: id, label: id, mini: TALKS[id].mini, counts: id !== 'tombrown' };
    });
    if (G.talksDone.length >= 3) out.push({ type: 'sign', label: 'Walk to the President’s desk' });
    return out;
  }
  if (s === 'talk' && G.talk) {
    return G.talk.replies.map(function (r, i) {
      return { type: 'reply', index: i, label: r.t, effects: Object.assign({ rapport: r.r || 0 }, r.residue || {}), flag: r.flag || null };
    });
  }
  if (s === 'mini' && mini && !mini.done) {
    return [{ type: 'mini-result', success: true, mini: mini.id }, { type: 'mini-result', success: false, mini: mini.id }];
  }
  if (s === 'sign') {
    if (G.signPhase === 'lines') return [{ type: 'sign-advance' }];
    if (G.signPhase === 'choices') return SIGN_CHOICES.map(function (c) { return { type: 'sign-choice', id: c.id, label: c.t }; });
    if (G.signPhase === 'mic') {
      return G.talksDone.slice(0, 3).map(function (id) { return { type: 'mic', id: id }; }).concat([{ type: 'mic', id: 'nobody' }]);
    }
  }
  if (s === 'gaggle') return [{ type: 'continue' }];
  return [];
}

function agentObserve() {
  return {
    screen: G.screen,
    playerId: G.playerId,
    talksDone: G.talksDone.slice(),
    talksLeft: Math.max(0, 3 - G.talksDone.length),
    toast: G.toast ? G.toast.t : null,
    typoChoice: G.typoChoice,
    endingId: G.screen === 'end' ? G.endingId : null,
    actions: agentLegalActions()
  };
}

function agentSame(a, b) {
  if (a.type !== b.type) return false;
  if ('id' in b && a.id !== b.id) return false;
  if ('index' in b && a.index !== b.index) return false;
  if ('success' in b && a.success !== b.success) return false;
  return true;
}

function agentAct(action) {
  if (!action || !agentLegalActions().some(function (l) { return agentSame(l, action); })) {
    throw new Error('illegal action on screen "' + G.screen + '": ' + JSON.stringify(action));
  }
  switch (action.type) {
    case 'pick-seat':
      startGame(action.id);
      break;
    case 'talk': {
      openTalk(action.id);
      const tk = G.talk;                       /* skip the typewriter: the lines are read */
      tk.lineIdx = tk.lines.length - 1; tk.typeT = 999; tk.phase = 'replies';
      break;
    }
    case 'reply':
      chooseReply(action.index);
      break;
    case 'mini-result': {
      const out = MINI_OUTCOMES[mini.id][action.success ? 'ok' : 'fail'];
      for (let i = 0; i < out.flags.length; i++) G.flags[out.flags[i]] = true;
      finishMini(action.success, Object.assign({}, out.residue), '');
      update(0.016);                           /* the loop applies the residue and closes the talk */
      break;
    }
    case 'sign':
      startSign();
      break;
    case 'sign-advance':
      G.signLine = SIGN_LINES.length - 1; G.signPhase = 'choices';
      break;
    case 'sign-choice':
      chooseSign(action.id);
      break;
    case 'mic':
      pickMic(action.id);
      break;
    case 'continue':
      G.gaggleT = 1e6; update(0.016);
      break;
  }
  return agentObserve();
}

window.__AGENT_API__ = { observe: agentObserve, legalActions: agentLegalActions, act: agentAct, MINI_OUTCOMES: MINI_OUTCOMES };

</script>
